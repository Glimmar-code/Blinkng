# Blinkng local Supabase configuration.
# Safe to commit: do not put production passwords, service-role keys,
# SMTP passwords, OAuth client secrets, Firebase private keys, or payment
# provider secret values in this file.

project_id = "blinkng"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true

[auth]
enabled = true

# Keep Edge Function authentication behavior source-controlled so a fallback
# deployment cannot silently change which endpoints require a JWT.
# BLINK LIFE short-lived online join tickets are issued to authenticated users.
# Do not deploy this function until dedicated game servers and env secrets exist.
[functions.blink-life-session]
verify_jwt = true

[functions.game-rewards]
verify_jwt = true

[functions.moderation-action]
verify_jwt = true

[functions.verify-payment]
verify_jwt = true

# Internal email worker must not accept end-user JWTs as authorization.
# This endpoint is protected by a separate strong server-only secret header.
# Do not deploy it until staging configuration and event-level tests pass.
[functions.send-essential-email]
verify_jwt = false

# Unsubscribe URL can be opened by email clients (no Supabase session).
# Requests must carry a verified expiring HMAC token; GET never changes consent.
[functions.unsubscribe-social-email]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = true

[functions.send-call-notification]
verify_jwt = true

[functions.blink-ai]
verify_jwt = true

[functions.blink-ai-v2]
verify_jwt = true

[functions.username-login]
verify_jwt = false

[functions.share-preview]
verify_jwt = false

[functions.blink-web]
verify_jwt = false

# AdMob authenticates this public webhook with Google's ECDSA signature, not a
# Supabase user JWT. The handler rejects invalid signatures before any write.
[functions.admob-reward-ssv]
verify_jwt = false

# Production Auth provider settings, redirect URLs, SMTP credentials and
# third-party secret values must be configured through Supabase/secrets
# management and documented as required configuration in RECOVERY.md.
# Secret values must never be committed to Git.

# BLINK essential account-security templates for local/Testlab Supabase.
# Signup confirmation is intentionally NOT added, configured, or enabled by this change.
# Preserve whatever signup confirmation policy the Supabase Auth project already has.
# Hosted Supabase projects require uploading these templates separately via
# Authentication > Email Templates; this file does NOT configure hosted SMTP.
# Keep SMTP credentials only in provider/Supabase secret settings.
[auth.email.template.recovery]
subject = "Reset your BLINK password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your BLINK email change"
content_path = "./supabase/templates/email_change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "BLINK security: your password was changed"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "BLINK security: your email was changed"
content_path = "./supabase/templates/email_changed_notification.html"
