name: BLINK chat media disposable database gate

on:
  pull_request:
    branches: [Testlab, main]
    paths:
      - 'supabase/migrations/*chat_photo*'
      - 'supabase/migrations/*view_once*'
      - 'supabase/functions/blink-view-once-image/**'
      - 'scripts/testing/chat_media_*'
      - '.github/workflows/chat-media-contract-gate.yml'
  workflow_dispatch:

concurrency:
  group: chat-media-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  private-media-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blink_chat_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: private-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blink_chat_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: blink_chat_ci
      PGUSER: postgres
      PGPASSWORD: private-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install temporary PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Build isolated schema fixture (never use production)
        run: psql -v ON_ERROR_STOP=1 -f scripts/testing/chat_media_staging_fixture.sql
      - name: Apply pending private-media migrations in order
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025100000_chat_photo_albums_and_bucket_limits.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025103000_view_once_private_media_contract.sql
      - name: Verify private bucket limits and atomic one-use access control
        run: psql -v ON_ERROR_STOP=1 -f scripts/testing/chat_media_contract_assertions.sql
      - name: Preview selective chat patch on latest main without touching main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main Testlab
          # PR #523 targets Testlab; main-derived integration PRs (e.g.
          # #543) must use their actual base. Never synthesize all of the
          # unrelated changes from the diverged Testlab branch.
          source_base="${{ github.event.pull_request.base.ref }}"
          case "$source_base" in
            main|Testlab) ;;
            *) echo "::error::Unexpected pull request base $source_base"; exit 1 ;;
          esac
          git diff --binary "origin/$source_base"...HEAD > "$RUNNER_TEMP/chat-pr.patch"
          git checkout --detach origin/main
          if git apply --3way --index "$RUNNER_TEMP/chat-pr.patch" > "$RUNNER_TEMP/merge-output.txt" 2>&1; then
            {
              echo 'CLEAN: The chat PR patch applies on top of current main.'
              echo 'Changed paths compared to main:'
              git diff --cached --name-only
            } > "$RUNNER_TEMP/chat-main-integration.txt"
          else
            {
              echo 'CONFLICT: Manual three-way reconciliation is required.'
              echo 'Current main was never modified or pushed.'
              cat "$RUNNER_TEMP/merge-output.txt"
              echo 'Unmerged paths:'
              git diff --name-only --diff-filter=U
            } > "$RUNNER_TEMP/chat-main-integration.txt"
            cat "$RUNNER_TEMP/chat-main-integration.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/chat-main-integration.txt"

      - name: Upload main-preservation preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: blink-chat-main-integration-preflight
          path: ${{ runner.temp }}/chat-main-integration.txt
          if-no-files-found: warn
          retention-days: 7
