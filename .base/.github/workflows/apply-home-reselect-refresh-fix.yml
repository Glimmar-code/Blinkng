name: Apply Home reselect and refresh fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_home_reselect_refresh_fix.py'
      - '.github/workflows/apply-home-reselect-refresh-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Home navigation and refresh fixes
        run: python3 .github/scripts/apply_home_reselect_refresh_fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit and safely land source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
                  app/src/main/java/com/example/ui/components/PremiumLoading.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: make Home reselect fast and predictable"

          for attempt in 1 2 3; do
            echo "Landing attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "A newer change conflicts with this Home fix; refusing to overwrite it."
              exit 1
            fi

            # Revalidate after rebasing onto any source changes that landed while this ran.
            gradle :app:compileDebugKotlin --stacktrace --no-daemon

            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "main kept moving after three validated attempts; refusing a force push."
          exit 1
