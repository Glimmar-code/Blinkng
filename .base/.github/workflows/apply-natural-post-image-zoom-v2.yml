name: Apply natural post image sizing and zoom v2

on:
  push:
    paths:
      - '.github/workflows/apply-natural-post-image-zoom-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply natural image and zoom changes
        run: python .github/scripts/apply_natural_post_image_zoom_v2.py
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/components/PostCard.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: preserve post image size and add pinch zoom"
            git push origin HEAD:main
          fi
