name: Testlab Call Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "supabase/functions/call-turn-credentials/**"
      - "supabase/config.toml"
      - ".github/workflows/testlab-call-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testlab-call-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-call-quality:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'Testlab-call-')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Call unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Debug APK compile
        run: gradle :app:assembleDebug --stacktrace --no-daemon
