name: Apply persistent chat history restore

on:
  push:
    paths:
      - '.github/scripts/apply_persistent_chat_history_restore.py'
      - '.github/workflows/apply-persistent-chat-history-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply chat history restore changes
        run: python .github/scripts/apply_persistent_chat_history_restore.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/data/repository/ChatRepository.kt \
            app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
            app/src/main/java/com/example/data/local/OfflineContentStore.kt
          git commit -m 'fix: restore persistent account chat history'

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt raced with another main update; retrying."
          done
          echo 'Unable to push after rebasing onto the latest main.'
          exit 1
