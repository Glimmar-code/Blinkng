name: Apply fast launch and resume-state fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_launch_resume_fix.py'
      - '.github/workflows/apply-launch-resume-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply patch
        run: python3 .github/scripts/apply_launch_resume_fix.py

      - name: Compile Android app
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Commit and push generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/ui/screens/AuthScreens.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/res/drawable/ic_splash_b.xml
          git commit -m "fix: speed up launch and restore last screen"
          git pull --rebase origin main
          git push origin HEAD:main
