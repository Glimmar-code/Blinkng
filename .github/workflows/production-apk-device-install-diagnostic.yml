name: Production APK install diagnostic (Android 15)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-apk-device-install-diagnostic.yml'
      - '.github/scripts/diagnose_production_apk_install.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download exact public APK releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p production/current production/previous
          gh release download v1.0.298604769 --repo "$GITHUB_REPOSITORY" --pattern Blink-latest.apk --dir production/current
          gh release download v1.0.298604418 --repo "$GITHUB_REPOSITORY" --pattern Blink-latest.apk --dir production/previous
          echo '4614e66bbc9611eb21b24056b83f66e16a297bfc4c40504fdf056eec245bc27e  production/current/Blink-latest.apk' | sha256sum --check
          echo '90eb72de1e084125800231373e608f95f4dce4805a8622435dbf7363adce63fc  production/previous/Blink-latest.apk' | sha256sum --check

      - name: Inspect ZIP, signatures, package and ARM64 libraries
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for variant in previous current; do
            apk="production/$variant/Blink-latest.apk"
            echo "=== Checking $apk ==="
            unzip -t "$apk" | tail -n 2
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            "$build_tools/aapt" dump badging "$apk" | head -n 4
            abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /[.]so$/ {print $2}' | sort -u)"
            printf 'Native libraries: %s\n' "$abis"
            if [[ -n "$abis" && "$abis" != *"arm64-v8a"* ]]; then
              echo "::error::Published APK contains native libraries but does not support ARM64 phones."
              exit 1
            fi
          done

      - name: Enable emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and upgrade actual published APK on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/diagnose_production_apk_install.sh

      - name: Save package installer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blink-production-apk-install-diagnostic
          path: install-output.txt
          if-no-files-found: warn
