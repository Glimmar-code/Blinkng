name: Production APK install diagnostic (Android 15)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-apk-device-install-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  signed-apk-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get actual public signed APK from successful release run
        uses: actions/download-artifact@v4
        with:
          name: blink-production-1.0.298604418-298604418
          repository: ${{ github.repository }}
          run-id: 38043456378
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifact

      - name: Verify the exact production APK bytes and manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-artifact -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "APK bytes: $(stat -c %s "$apk")"
          echo "90eb72de1e084125800231373e608f95f4dce4805a8622435dbf7363adce63fc  $apk" | sha256sum --check --status
          echo "Production signed APK digest confirmed."
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | head -n 12

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Attempt clean install of exact production APK on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -u
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            # Capture installer code instead of relying on the phone's generic error message.
            adb install -r "$APK" > install-output.txt 2>&1
            result=$?
            cat install-output.txt
            if [ "$result" -ne 0 ]; then
              echo "::error::Android 15 rejected BLINK production APK (adb exit $result)."
              adb logcat -d -s PackageManager:* PackageInstaller:* installd:* | tail -n 150 || true
              exit "$result"
            fi
            adb shell pm path com.aistudio.blink.appvtwo
            adb shell dumpsys package com.aistudio.blink.appvtwo | grep -E 'version(Code|Name)|primaryCpuAbi' | head -n 12 || true
            echo "Exact public BLINK production APK installed on clean Android 15 emulator."

      - name: Save installer diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blink-production-apk-install-diagnostic
          path: install-output.txt
          if-no-files-found: warn
