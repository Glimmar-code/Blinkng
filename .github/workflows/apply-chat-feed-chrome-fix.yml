name: Apply chat history and feed chrome fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_chat_feed_chrome_fix.py'
      - '.github/workflows/apply-chat-feed-chrome-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply requested chat and feed fixes
        run: python3 .github/scripts/apply_chat_feed_chrome_fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/java/com/example/ui/screens/MessagesScreen.kt \
                  app/src/main/java/com/example/ui/screens/FeedScreen.kt \
                  app/src/main/java/com/example/ui/components/PostCard.kt \
                  app/src/main/java/com/example/ui/components/PostOptionsMenuSheet.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: preserve chat history and refine feed chrome"
          git push origin main
