name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional public version name, for example 1.1.0
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify permanent signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured. Add the permanent production signing value in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/blink-production-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Resolve monotonically increasing version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail
          # This workflow's run number only moves forward, so every new release gets
          # a larger Android versionCode automatically.
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large: $VERSION_CODE"
            exit 1
          fi

          if [ -n "${REQUESTED_VERSION_NAME:-}" ]; then
            VERSION_NAME="$REQUESTED_VERSION_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          fi

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Blink $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build signed production APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Write release metadata
        shell: bash
        run: |
          mkdir -p app/build/outputs/publish
          cat > app/build/outputs/publish/release-info.txt <<EOF
          applicationId=com.aistudio.blink.appvtwo
          versionCode=${{ steps.version.outputs.code }}
          versionName=${{ steps.version.outputs.name }}
          commit=$GITHUB_SHA
          EOF

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: blink-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/publish/release-info.txt
