name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional public version name, for example 1.1.0
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a production-approved main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Refusing to sign a production release from a commit that is not on main. Test in Testlab/staging and merge through the approved production path first."
            exit 1
          fi
          echo "Release source is present on main: $GITHUB_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify permanent signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured. Add the permanent production signing value in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/blink-production-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Pin production signing certificate
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          EXPECTED_SHA1="$(python3 - <<'PY'
          import json
          from pathlib import Path

          package_name = "com.aistudio.blink.appvtwo"
          data = json.loads(Path("app/google-services.json").read_text())
          for client in data.get("client", []):
              for oauth in client.get("oauth_client", []):
                  android = oauth.get("android_info") or {}
                  if android.get("package_name") == package_name and android.get("certificate_hash"):
                      print(android["certificate_hash"].replace(":", "").lower())
                      raise SystemExit(0)
          raise SystemExit(f"No pinned Android OAuth certificate found for {package_name}")
          PY
          )"

          CERT_PEM="$RUNNER_TEMP/blink-production-release.pem"
          keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -rfc > "$CERT_PEM"

          ACTUAL_SHA1="$(openssl x509 -in "$CERT_PEM" -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(openssl x509 -in "$CERT_PEM" -noout -fingerprint -sha256 | sed 's/^.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Production signing certificate does not match the certificate pinned for com.aistudio.blink.appvtwo. Refusing to publish an APK that Android would treat as a different signer."
            echo "Expected SHA-1: $EXPECTED_SHA1"
            echo "Actual SHA-1:   $ACTUAL_SHA1"
            exit 1
          fi

          echo "RELEASE_CERT_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_SHA256=$ACTUAL_SHA256" >> "$GITHUB_ENV"
          echo "Production signing certificate continuity verified."

      - name: Resolve monotonically increasing version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail

          EPOCH_MINUTES=$(( $(date -u +%s) / 60 ))
          RUN_SLOT=$(( GITHUB_RUN_NUMBER % 10 ))
          VERSION_CODE=$(( EPOCH_MINUTES * 10 + RUN_SLOT ))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode is too large: $VERSION_CODE"
            exit 1
          fi

          if [ -n "${REQUESTED_VERSION_NAME:-}" ]; then
            VERSION_NAME="$REQUESTED_VERSION_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.$VERSION_CODE"
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Resolved versionName is empty."
            exit 1
          fi

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Blink $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build signed production APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify production package, version and APK signature
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='com.aistudio.blink.appvtwo'" >/dev/null || {
            echo "::error::Release APK applicationId is not com.aistudio.blink.appvtwo."
            exit 1
          }
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'" >/dev/null || {
            echo "::error::Release APK versionCode does not match the generated versionCode."
            exit 1
          }
          echo "$BADGING" | grep -F "versionName='$EXPECTED_VERSION_NAME'" >/dev/null || {
            echo "::error::Release APK versionName does not match the generated versionName."
            exit 1
          }

          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          if [ -z "$AAB" ]; then
            echo "::error::Signed release AAB was not produced."
            exit 1
          fi
          jarsigner -verify "$AAB" >/dev/null

          echo "APK package/version/signature and AAB signature verified."

      - name: Write release metadata
        shell: bash
        run: |
          mkdir -p app/build/outputs/publish
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          cat > app/build/outputs/publish/release-info.txt <<EOF
          applicationId=com.aistudio.blink.appvtwo
          versionCode=${{ steps.version.outputs.code }}
          versionName=${{ steps.version.outputs.name }}
          commit=$GITHUB_SHA
          productionSource=main
          signingCertificateSha1=$RELEASE_CERT_SHA1
          signingCertificateSha256=$RELEASE_CERT_SHA256
          apkSha256=$APK_SHA256
          EOF

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: blink-production-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/publish/release-info.txt
