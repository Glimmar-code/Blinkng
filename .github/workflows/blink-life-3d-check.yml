name: BLINK LIFE native 3D Godot smoke

on:
  pull_request:
    paths:
      - 'game3d/**'
      - '.github/workflows/blink-life-3d-check.yml'
  push:
    branches: [Testlab, main]
    paths:
      - 'game3d/**'
      - '.github/workflows/blink-life-3d-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot3d:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          mkdir -p /tmp/blink-godot
          unzip -q /tmp/godot.zip -d /tmp/blink-godot
          sudo install -m 0755 /tmp/blink-godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Install software OpenGL test display
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-utils
      - name: Import project and parse all scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path game3d --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Ei '(^ERROR:|^SCRIPT ERROR:|Parse Error)' /tmp/godot-import.log; then
            echo 'Godot import failed.'
            exit 1
          fi
      - name: Check neighborhood scale, entrance clearance and connected paths
        shell: bash
        run: |
          set -euo pipefail
          python3 game3d/tests/check_realism_tracker.py
          timeout 60s godot --headless --path game3d --script res://tests/neighborhood_smoke.gd 2>&1 | tee /tmp/blink-neighborhood.log
          if grep -Ei '(^ERROR:|^SCRIPT ERROR:|Parse Error|SMOKE FAILURE)' /tmp/blink-neighborhood.log; then
            exit 1
          fi

      - name: Test control acceleration and saved settings
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path game3d --script res://tests/controls_smoke.gd 2>&1 | tee /tmp/blink-controls.log
          if grep -Ei '(^ERROR:|^SCRIPT ERROR:|Parse Error|SMOKE FAILURE)' /tmp/blink-controls.log; then
            exit 1
          fi

      - name: Test HMAC join tickets, replay protection and server-backed houses
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path game3d --script res://tests/auth_smoke.gd 2>&1 | tee /tmp/blink-life-auth-tests.log
          if grep -Ei '(^ERROR:|^SCRIPT ERROR:|Parse Error|SMOKE FAILURE)' /tmp/blink-life-auth-tests.log; then
            echo 'Dedicated game authentication or persistence regression detected.'
            exit 1
          fi

      - name: Exercise real local UDP multiplayer sockets and server restart
        shell: bash
        run: |
          set -euo pipefail
          # Real Godot ENet processes (host + two independent clients), not
          # mocked RPCs. Exercises identity tickets, two unique owned homes,
          # an invalid-signature client and durable homes after server restart.
          # Loopback-only: NOT Internet / cloud hosting or encryption evidence.
          timeout 120s python3 game3d/tests/online_network_smoke.py 2>&1 | tee /tmp/blink-life-online-network.log
          if grep -Ei '(ONLINE_SMOKE_FAILURE:|SCRIPT ERROR:|Parse Error)' /tmp/blink-life-online-network.log; then
            echo 'BLINK LIFE two-client network integration failed.'
            exit 1
          fi

      - name: Test dedicated staging healthcheck fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          file="$(mktemp)"
          trap 'rm -f "$file"' EXIT
          healthcheck="game3d/scripts/server_healthcheck.sh"
          rm -f "$file"
          if BLINK_LIFE_HEALTH_FILE="$file" sh "$healthcheck"; then
            echo "Missing game server heartbeat was incorrectly considered healthy"
            exit 1
          fi
          echo 'ready' > "$file"
          BLINK_LIFE_HEALTH_FILE="$file" sh "$healthcheck"
          touch -d '40 seconds ago' "$file"
          if BLINK_LIFE_HEALTH_FILE="$file" sh "$healthcheck"; then
            echo "Stale/failed game server heartbeat was incorrectly considered healthy"
            exit 1
          fi
          echo 'offline' > "$file"
          if BLINK_LIFE_HEALTH_FILE="$file" sh "$healthcheck"; then
            echo "Non-ready server was incorrectly considered healthy"
            exit 1
          fi
          echo "PASS: Dedicated server healthcheck is readiness-aware and fails closed"

      - name: Run native 3D interactive scene smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # Use the actual OpenGL Compatibility renderer. Godot 4.3's
          # dummy headless renderer reports false null-mesh errors for MeshInstance3D.
          timeout 90s xvfb-run -a --server-args="-screen 0 1280x720x24" godot \
            --rendering-driver opengl3 --audio-driver Dummy --path game3d --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-tests.log
          if grep -Ei '(^ERROR:|^SCRIPT ERROR:|Parse Error)' /tmp/godot-tests.log; then
            echo 'Godot scene smoke tests failed.'
            exit 1
          fi

  staging-container:
    needs: godot3d
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Generate disposable localhost TLS certificate and volume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blink-life-cert" "$RUNNER_TEMP/blink-life-state"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$RUNNER_TEMP/blink-life-cert/key.pem" \
            -out "$RUNNER_TEMP/blink-life-cert/cert.pem" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' \
            >/dev/null 2>&1
          sudo chown -R 10001:65534 "$RUNNER_TEMP/blink-life-cert" "$RUNNER_TEMP/blink-life-state"
          sudo chmod 0700 "$RUNNER_TEMP/blink-life-cert"
          sudo chmod 0400 "$RUNNER_TEMP/blink-life-cert/key.pem"
          sudo chmod 0444 "$RUNNER_TEMP/blink-life-cert/cert.pem"
          sudo chmod 0750 "$RUNNER_TEMP/blink-life-state"
      - name: Build production-like unprivileged Godot container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f game3d/Dockerfile -t blink-life-ci:${GITHUB_SHA} .
      - name: Start real TLS container with persistent ledger
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name blink-life-staging-ci \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 768m \
            --mount type=bind,source="$RUNNER_TEMP/blink-life-state",target=/var/lib/blinklife \
            --mount type=bind,source="$RUNNER_TEMP/blink-life-cert",target=/run/blinklife/tls,readonly \
            -p 127.0.0.1:24567:24567/tcp \
            -e BLINK_LIFE_SERVER_PORT=24567 \
            -e BLINK_LIFE_AUTH_SECRET=ci-only-example-secret-never-use-in-production-987654321 \
            -e BLINK_LIFE_TLS_CERT_PATH=/run/blinklife/tls/cert.pem \
            -e BLINK_LIFE_TLS_KEY_PATH=/run/blinklife/tls/key.pem \
            -e BLINK_LIFE_HEALTH_FILE=/var/lib/blinklife/server.health \
            blink-life-ci:${GITHUB_SHA}
      - name: Assert container health and verified WebSocket connectivity
        shell: bash
        run: |
          set -euo pipefail
          check_ready() {
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' blink-life-staging-ci)"
              if [ "$status" = healthy ]; then return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' blink-life-staging-ci)" != true ]; then
                docker logs --tail 80 blink-life-staging-ci
                return 1
              fi
              sleep 1
            done
            docker logs --tail 80 blink-life-staging-ci
            echo 'Game container never became healthy'
            return 1
          }
          check_ready
          python3 scripts/blink_life_staging_preflight.py \
            --host localhost --port 24567 --loopback-only \
            --cafile "$RUNNER_TEMP/blink-life-cert/cert.pem"
          if python3 scripts/blink_life_staging_preflight.py \
              --host localhost --port 24567 --loopback-only; then
            echo 'Self-signed game server unexpectedly trusted without CA!'
            exit 1
          fi
          docker restart blink-life-staging-ci >/dev/null
          check_ready
          python3 scripts/blink_life_staging_preflight.py \
            --host localhost --port 24567 --loopback-only \
            --cafile "$RUNNER_TEMP/blink-life-cert/cert.pem"
          echo 'PASS: unprivileged staging Docker container healthy, encrypted and restartable'
      - name: Always discard test container and certificates
        if: always()
        shell: bash
        run: |
          docker rm -f blink-life-staging-ci >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/blink-life-cert" "$RUNNER_TEMP/blink-life-state"

