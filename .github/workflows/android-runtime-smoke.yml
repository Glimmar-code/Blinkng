name: Android runtime smoke

on:
  push:
    branches:
      - main
      - Testlab
      - 'Testlab-*'
      - 'Testlab/**'
    paths:
      - 'app/src/**'
      - 'shared/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-runtime-smoke.yml'
  pull_request:
    branches:
      - main
      - Testlab
    paths:
      - 'app/src/**'
      - 'shared/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation smoke tests on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          # Exercise real Compose transitions; the old smoke suite forcibly disabled them.
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            echo "System animator duration scale: $(adb shell settings get global animator_duration_scale)"
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon > app/build/runtime-gradle.log 2>&1 || { tail -n 80 app/build/runtime-gradle.log; exit 1; }
            # Export emulator-rendered Compose staging fixture for visual audit.
            # This test data is separate from the production APK and account content.
            mkdir -p app/build/visual-audit
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/home-reference-staging-light.png app/build/visual-audit/home-reference-staging-light.png
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/home-reference-with-create.png app/build/visual-audit/home-reference-with-create.png
            test -s app/build/visual-audit/home-reference-staging-light.png
            test -s app/build/visual-audit/home-reference-with-create.png
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/inbox-reference-staging-light.png app/build/visual-audit/inbox-reference-staging-light.png
            test -s app/build/visual-audit/inbox-reference-staging-light.png
            # Capture the actual Contest test fixture to inspect small alignment errors.
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/contest-hero-podium-winners-staging.png app/build/visual-audit/contest-hero-podium-winners-staging.png
            test -s app/build/visual-audit/contest-hero-podium-winners-staging.png
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/contest-applicant-card-staging.png app/build/visual-audit/contest-applicant-card-staging.png
            test -s app/build/visual-audit/contest-applicant-card-staging.png
            # Reference composer screenshots are produced on the emulator, not fabricated.
            # android-emulator-runner executes each script line separately. Keep the loop on one line.
            for view in landing landing-light-host gallery details options text-toolbar poll video-clips preview photo-editor mentions; do adb pull "/sdcard/Pictures/BLINK-Visual-Audit/create-post-${view}-staging.png" "app/build/visual-audit/create-post-${view}-staging.png" && test -s "app/build/visual-audit/create-post-${view}-staging.png" || exit 1; done
            # These captures use the actual full CreatePostSheet, not isolated toolbar fixtures.
            for view in full-text full-mentions; do adb pull "/sdcard/Pictures/BLINK-Visual-Audit/create-post-${view}-staging.png" "app/build/visual-audit/create-post-${view}-staging.png" && test -s "app/build/visual-audit/create-post-${view}-staging.png" || exit 1; done
            # Capture native dark conversation chrome for the reference audit.
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/chat-reference-staging-dark.png app/build/visual-audit/chat-reference-staging-dark.png
            test -s app/build/visual-audit/chat-reference-staging-dark.png
            # Three slices of the actual Compose conversation with synthetic
            # media fixtures. Retain all captures for manual side-by-side review.
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/chat-reference-full-top.png app/build/visual-audit/chat-reference-full-top.png
            test -s app/build/visual-audit/chat-reference-full-top.png
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/chat-reference-full-media.png app/build/visual-audit/chat-reference-full-media.png
            test -s app/build/visual-audit/chat-reference-full-media.png
            adb pull /sdcard/Pictures/BLINK-Visual-Audit/chat-reference-full-bottom.png app/build/visual-audit/chat-reference-full-bottom.png
            test -s app/build/visual-audit/chat-reference-full-bottom.png
            for theme in dark light; do adb pull "/sdcard/Pictures/BLINK-Visual-Audit/chat-reference-outgoing-document-${theme}.png" "app/build/visual-audit/chat-reference-outgoing-document-${theme}.png" && test -s "app/build/visual-audit/chat-reference-outgoing-document-${theme}.png" || exit 1; done

      - name: Expose actual runtime failures through check annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as E
          def report(title, text):
              text = re.sub(r'eyJ[A-Za-z0-9_.-]+', '[token omitted]', text)
              text = re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+', '[key omitted]', text)
              text = text[:6500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::{text}')
          for path in Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'):
              try:
                  root = E.parse(path).getroot()
              except E.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in case.findall(kind):
                          report('Android runtime test', f"{case.get('classname')}.{case.get('name')}: {failure.get('message', '')}\n{failure.text or ''}")
          log = Path('app/build/runtime-gradle.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'^e:|FAILURE:|Caused by:|Execution failed|FAILED|failed tests', line)]
              report('Android runtime build', '\n'.join(errors[:20] or lines[-50:]))
          report('Runtime capture files', '\n'.join(str(p) for p in Path('app/build/visual-audit').glob('*.png')))
          PY

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/visual-audit/
            app/build/runtime-gradle.log
          if-no-files-found: warn
          retention-days: 14
