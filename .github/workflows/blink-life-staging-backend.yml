name: BLINK LIFE staging world backend

on:
  pull_request:
    paths:
      - 'game3d/staging/**'
      - 'supabase/functions/blink-life-world-sync/**'
      - '.github/workflows/blink-life-staging-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-sql:
    name: Verify server-only world SQL in disposable Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only_password
          POSTGRES_DB: blink_life_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blink_life_test"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local_test_only_password
      PGDATABASE: blink_life_test
    steps:
      - uses: actions/checkout@v4
      - name: Install local Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Create minimal ephemeral Supabase role stubs
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users (id uuid primary key);
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL
      - name: Apply staging schema and test transactions and permissions
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f game3d/staging/world_schema.sql
          psql -v ON_ERROR_STOP=1 -f game3d/staging/world_schema_test.sql
  edge-check:
    name: Typecheck private HMAC world-state function
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.5
      - name: Check Edge Function TypeScript
        run: deno check supabase/functions/blink-life-world-sync/index.ts
