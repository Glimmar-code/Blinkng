name: Apply Connect vertical directory patch

on:
  push:
    branches:
      - feature/connect-vertical-directory-20

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/connect-vertical-directory-20
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply_connect_vertical_directory.py

      - name: Commit patched Connect UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Make Connect categories vertical and database-backed"
          git push origin HEAD:feature/connect-vertical-directory-20
