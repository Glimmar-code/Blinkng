name: Patch native call runtime fallback

on:
  push:
    branches:
      - fix/native-chat-calls-20260907
    paths:
      - .github/workflows/patch-call-runtime-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-chat-calls-20260907
          fetch-depth: 0
      - name: Apply call runtime fallback patch
        run: python .github/scripts/patch_call_runtime_fallback.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'answerRequested && incomingRinging' app/src/main/java/com/example/call/CallActivity.kt
          grep -q 'IncomingCallEvent' app/src/main/java/com/example/data/supabase/SupabaseRealtimeManager.kt
          grep -q 'RealtimeEvent.IncomingCallEvent' app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/call/CallActivity.kt \
                  app/src/main/java/com/example/data/supabase/SupabaseRealtimeManager.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
          git commit -m 'Fix incoming call realtime and answer race'
          git pull --rebase origin fix/native-chat-calls-20260907
          git push origin HEAD:fix/native-chat-calls-20260907
