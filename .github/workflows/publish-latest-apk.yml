name: Publish latest APK

# Manual only. Verify the chosen signed run is successful, owned by BLINK,
# and built from the latest main SHA before accepting any production artifact.
on:
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: "Successful Signed Android release workflow run ID from latest main"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-apk
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Glimmar-code/Blinkng' && github.ref == 'refs/heads/main' && github.actor == 'Glimmar-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Independently verify the exact signed main run
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Glimmar-code', repo = 'Blinkng';
            const id = Number(context.payload.inputs?.signed_run_id);
            if (!Number.isSafeInteger(id) || id < 1) throw new Error('Provide a valid signed workflow run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: id
            });
            if (run.name !== 'Signed Android release' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_branch !== 'main' || run.head_repository?.full_name !== owner+'/'+repo ||
                run.event !== 'workflow_dispatch') {
              throw new Error('Selected run is not a successful, manually started main release');
            }
            const {data: main} = await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if (main.commit.sha !== run.head_sha) {
              throw new Error('Selected signed APK belongs to an older main revision');
            }
            core.setOutput('signed_run_id', String(id));
            core.setOutput('signed_commit', run.head_sha);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.signed_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the manually selected signed production artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.signed_run_id }}
          path: downloaded-release

      - name: Verify, upload as draft, download back, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.source.outputs.signed_commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/scripts/publish_verified_apk.py downloaded-release
          --repository "$RELEASE_REPOSITORY"
          --commit "$RELEASE_COMMIT"
