name: Publish latest APK

on:
  workflow_run:
    workflows:
      - Signed Android release
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-apk
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Block publication until Android install/runtime and mandatory CI pass\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}\n          RELEASE_REPOSITORY: ${{ github.repository }}\n        run: >-\n          python3 .github/scripts/check_release_gates.py\n          --repository "$RELEASE_REPOSITORY"\n          --commit "$RELEASE_COMMIT"\n          --timeout-seconds 2700\n\n      - name: Download signed production artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-release

      - name: Verify, upload as draft, download back, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/scripts/publish_verified_apk.py downloaded-release
          --repository "$RELEASE_REPOSITORY"
          --commit "$RELEASE_COMMIT"
