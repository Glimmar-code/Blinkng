name: Apply Story verified display names

on:
  push:
    branches:
      - fix/story-verified-display-names

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/story-verified-display-names
          fetch-depth: 0

      - name: Apply focused identity patch
        run: python .github/scripts/apply_story_verified_display_names.py

      - name: Remove temporary patch runner
        run: |
          rm -f .github/scripts/apply_story_verified_display_names.py
          rm -f .github/workflows/apply-story-verified-display-names.yml

      - name: Commit patched app code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Show verified Story creators by display name"
          git push origin HEAD:fix/story-verified-display-names
