name: Apply comment and message receipt fix v3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_comment_message_receipts_fix_v2.py'
      - '.github/scripts/patch_legacy_message_receipts.py'
      - '.github/workflows/apply-comment-message-receipts-fix-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Android messaging patch
        run: |
          python3 .github/scripts/apply_comment_message_receipts_fix_v2.py
          python3 .github/scripts/patch_legacy_message_receipts.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/models/PostModel.kt \
                  app/src/main/java/com/example/data/repository/ChatRepository.kt \
                  app/src/main/java/com/example/data/supabase/SupabaseRealtimeManager.kt \
                  app/src/main/java/com/example/notification/BlinkFirebaseMessagingService.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/ui/screens/PremiumMessagesScreen.kt \
                  app/src/main/java/com/example/ui/screens/MessagesScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: comments and real chat delivery receipts"
          git push origin main
