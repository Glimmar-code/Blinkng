name: AdMob SSV verifier gate

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run AdMob SSV cryptographic regression tests
        run: node --test scripts/test_admob_ssv_verifier.mjs
