name: Apply premium auth UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auth-premium.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply auth visual patch
        run: python3 .github/scripts/apply_auth_premium.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit auth upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/AuthScreens.kt \
                  app/src/main/java/com/example/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No auth UI changes needed."
            exit 0
          fi
          git commit -m "feat: premium login and signup theme motion"
          git push origin main
