name: BLINK live content disposable PostgreSQL gate

on:
  pull_request:
    branches: [Testlab, main]
    paths:
      - 'supabase/migrations/20261019100000_blink_live_configuration.sql'
      - 'supabase/migrations/20261019113000_admin_blink_live_config_manager.sql'
      - 'supabase/migrations/20261019150000_blink_live_campaigns_v1.sql'
      - 'supabase/tests/blink_live_campaigns_*'
      - '.github/workflows/blink-live-postgres.yml'
  push:
    branches: [Testlab]
    paths:
      - 'supabase/migrations/20261019100000_blink_live_configuration.sql'
      - 'supabase/migrations/20261019113000_admin_blink_live_config_manager.sql'
      - 'supabase/migrations/20261019150000_blink_live_campaigns_v1.sql'
      - 'supabase/tests/blink_live_campaigns_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-content-security-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: blink_live_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d blink_live_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_only
      PGDATABASE: blink_live_ci
    steps:
      - uses: actions/checkout@v4
      - name: Ensure isolated PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create isolated fake user roles and university accounts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/blink_live_campaigns_fixture.pgfixture
      - name: Apply only BLINK Live Configuration migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019100000_blink_live_configuration.sql
      - name: Apply owner-authorized, audited Live Content admin RPCs
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019113000_admin_blink_live_config_manager.sql
      - name: Apply scheduled campaign and engagement schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019150000_blink_live_campaigns_v1.sql
      - name: Prove roles, targeting, approval, audit, and safe analytics
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/blink_live_campaigns_assertions.pgfixture
      - name: Confirm no production secrets or databases used
        run: echo 'All tests ran against disposable fake PostgreSQL data. Production Supabase was untouched.'
