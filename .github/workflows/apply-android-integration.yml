name: Apply Android integration patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'ci: apply Android integration patch and push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply integration patch
        run: python .github/scripts/patch_android_integration.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/components/AppMenuSheet.kt app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
          if git diff --cached --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git commit -m 'ci: apply Android integration patch and push'
          git push origin HEAD:main
