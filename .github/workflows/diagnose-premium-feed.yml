name: Diagnose premium feed compile

on:
  push:
    branches: [chatgpt/premium-feed-redesign]
    paths:
      - '.github/workflows/diagnose-premium-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/premium-feed-redesign
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Correct Compose animation imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('app/src/main/java/com/example/ui/components/FloatingBottomBar.kt'),
              Path('app/src/main/java/com/example/ui/components/PostCard.kt'),
              Path('app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'import androidx.compose.animation.core.animateColorAsState',
                  'import androidx.compose.animation.animateColorAsState'
              )
              text = text.replace(
                  'import androidx.compose.ui.draw.graphicsLayer',
                  'import androidx.compose.ui.graphics.graphicsLayer'
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Compile and capture diagnostics
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          gradle :app:compileDebugKotlin --stacktrace --console=plain > /tmp/premium-feed-compile.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo "--- compiler diagnostics ---"
            grep -E '(^e:| error: |FAILURE:|What went wrong:)' /tmp/premium-feed-compile.log | tail -n 240 || true
            echo "--- tail ---"
            tail -n 180 /tmp/premium-feed-compile.log
          } > .ci/premium-feed-compile.txt
      - name: Commit fixes and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/components/FloatingBottomBar.kt \
                  app/src/main/java/com/example/ui/components/PostCard.kt \
                  app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt \
                  .ci/premium-feed-compile.txt
          git commit -m "fix: correct premium feed Compose imports" || exit 0
          git push origin HEAD:chatgpt/premium-feed-redesign
