name: Apply navigation build runtime fix

on:
  push:
    branches:
      - fix/navigation-build-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-build-runtime
          fetch-depth: 0

      - name: Patch navigation wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          search = Path('app/src/main/java/com/example/ui/screens/SearchScreen.kt')
          s = search.read_text()
          for line in [
              'import androidx.activity.ComponentActivity\n',
              'import androidx.activity.compose.LocalActivity\n',
              'import androidx.lifecycle.ViewModelProvider\n',
              'import com.example.viewmodel.BlinkViewModel\n',
              'import com.example.viewmodel.MainTab\n',
          ]:
              s = s.replace(line, '')
          s = replace_once(
              s,
              '    onDeletePost: (String) -> Unit = {},\n    isDark: Boolean\n',
              '    onDeletePost: (String) -> Unit = {},\n    onBackToHome: () -> Unit = {},\n    isDark: Boolean\n',
              'SearchScreen callback parameter'
          )
          s = replace_once(
              s,
              '    val activity = LocalActivity.current as? ComponentActivity\n    val rootViewModel = remember(activity) {\n        activity?.let { ViewModelProvider(it)[BlinkViewModel::class.java] }\n    }\n',
              '',
              'SearchScreen activity ViewModel lookup'
          )
          s = replace_once(
              s,
              '    fun goHome() {\n        rootViewModel?.setTab(MainTab.HOME)\n    }\n',
              '    fun goHome() {\n        onBackToHome()\n    }\n',
              'SearchScreen goHome'
          )
          search.write_text(s)

          main = Path('app/src/main/java/com/example/MainActivity.kt')
          m = main.read_text()
          m = replace_once(
              m,
              '    LaunchedEffect(uiState.selectedTab) {\n        isBottomBarVisibleByScroll = true\n    }\n',
              '    LaunchedEffect(uiState.selectedTab) {\n        isBottomBarVisibleByScroll = true\n    }\n\n    // Old builds persisted Home/Reel/Connect/Game as feedSubTab values.\n    // Always enter the redesigned Home shell on a fresh MainAppContent session.\n    LaunchedEffect(Unit) {\n        if (uiState.selectedTab == MainTab.HOME && uiState.feedSubTab != 0) {\n            viewModel.setFeedSubTab(0)\n        }\n    }\n',
              'MainAppContent legacy sub-tab normalization'
          )
          m = replace_once(
              m,
              '                        onDeletePost = { viewModel.deletePost(it) },\n                        isDark = uiState.isDarkMode\n',
              '                        onDeletePost = { viewModel.deletePost(it) },\n                        onBackToHome = {\n                            viewModel.setTab(MainTab.HOME)\n                            viewModel.setFeedSubTab(0)\n                        },\n                        isDark = uiState.isDarkMode\n',
              'MainActivity SearchScreen back callback'
          )
          main.write_text(m)

          vm = Path('app/src/main/java/com/example/viewmodel/BlinkViewModel.kt')
          v = vm.read_text()
          v = replace_once(
              v,
              '            selectedTab = selected,\n            feedSubTab = prefs.getInt(KEY_FEED_SUB_TAB, 0).coerceIn(0, 3)\n',
              '            selectedTab = selected,\n            // Do not restore the retired Home/Reel/Connect/Game sub-tab state.\n            // Home now always starts on the premium For You lane.\n            feedSubTab = 0\n',
              'ViewModel restore feedSubTab'
          )
          v = replace_once(
              v,
              '    fun selectTab(tab: MainTab) {\n        _uiState.value = _uiState.value.copy(selectedTab = tab, viewingProfile = null, viewingProduct = null, isConversationFullScreen = false)\n        persistUiPreferences()\n    }\n',
              '    fun selectTab(tab: MainTab) {\n        val nextFeedSubTab = if (tab == MainTab.HOME) 0 else _uiState.value.feedSubTab\n        _uiState.value = _uiState.value.copy(\n            selectedTab = tab,\n            feedSubTab = nextFeedSubTab,\n            viewingProfile = null,\n            viewingProduct = null,\n            isConversationFullScreen = false\n        )\n        persistUiPreferences()\n    }\n',
              'ViewModel selectTab Home reset'
          )
          vm.write_text(v)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/SearchScreen.kt \
                  app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
          git commit -m "fix: make premium feed navigation the runtime default"
          git push origin HEAD:fix/navigation-build-runtime
