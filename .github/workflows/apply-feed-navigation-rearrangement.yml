name: Apply feed navigation rearrangement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-feed-navigation-rearrangement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Rearrange feed navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          def require_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Could not locate {label}')
              return text.replace(old, new, 1)

          chrome_path = Path('app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt')
          chrome = chrome_path.read_text()
          chrome = require_replace(
              chrome,
              'import androidx.compose.material.icons.filled.MoreVert\n',
              'import androidx.compose.material.icons.filled.Menu\n',
              'MoreVert import'
          )

          top_pattern = re.compile(
              r'@Composable\nfun FeedTopBar\(.*?\n@Composable\nprivate fun FeedRadialHeaderAction\(',
              re.S,
          )
          top_replacement = '''@Composable
          fun FeedTopBar(
              userAvatar: String,
              hasUnreadNotifications: Boolean,
              onSearchClick: () -> Unit,
              onNotificationClick: () -> Unit,
              onMenuClick: () -> Unit,
              onProfileClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              BoxWithConstraints(
                  modifier = modifier
                      .fillMaxWidth()
                      .background(FeedBackground)
                      .drawBehind {
                          drawRect(
                              brush = Brush.radialGradient(
                                  colors = listOf(FeedPurple.copy(alpha = 0.16f), Color.Transparent),
                                  center = Offset(size.width * 0.22f, 0f),
                                  radius = size.width * 0.72f
                              )
                          )
                          drawRect(
                              brush = Brush.radialGradient(
                                  colors = listOf(FeedBlue.copy(alpha = 0.11f), Color.Transparent),
                                  center = Offset(size.width * 0.84f, 0f),
                                  radius = size.width * 0.58f
                              )
                          )
                      }
                      .statusBarsPadding()
              ) {
                  val horizontalPadding = if (maxWidth >= 600.dp) 20.dp else 14.dp

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(
                              start = horizontalPadding,
                              end = horizontalPadding,
                              top = 8.dp,
                              bottom = 8.dp
                          ),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      FeedBrandBlock(
                          userAvatar = userAvatar,
                          onProfileClick = onProfileClick,
                          modifier = Modifier
                              .weight(1f)
                              .padding(end = 4.dp)
                      )
                      FeedHeaderActions(
                          hasUnreadNotifications = hasUnreadNotifications,
                          onSearchClick = onSearchClick,
                          onNotificationClick = onNotificationClick,
                          onMenuClick = onMenuClick
                      )
                  }
              }
          }

          @Composable
          private fun FeedBrandBlock(
              userAvatar: String,
              onProfileClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              Row(
                  modifier = modifier,
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  FeedProfileAvatar(
                      userAvatar = userAvatar,
                      onProfileClick = onProfileClick
                  )
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          text = "Home",
                          style = MaterialTheme.typography.headlineSmall,
                          color = FeedTextPrimary,
                          maxLines = 1
                      )
                      Text(
                          text = "Your campus, in real time",
                          style = MaterialTheme.typography.bodyMedium,
                          color = FeedTextSecondary,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

          @Composable
          private fun FeedProfileAvatar(
              userAvatar: String,
              onProfileClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .size(50.dp)
                      .background(feedAccentBrush(), CircleShape)
                      .padding(2.dp)
                      .background(FeedBackground, CircleShape)
                      .padding(2.dp)
                      .clickable(role = Role.Button, onClick = onProfileClick)
                      .semantics { contentDescription = "Open profile" }
                      .testTag("feed_profile_action"),
                  contentAlignment = Alignment.Center
              ) {
                  AsyncImage(
                      model = userAvatar,
                      contentDescription = null,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier
                          .size(42.dp)
                          .background(FeedElevatedSurface, CircleShape)
                          .graphicsLayer { clip = true; shape = CircleShape }
                  )
              }
          }

          @Composable
          private fun FeedHeaderActions(
              hasUnreadNotifications: Boolean,
              onSearchClick: () -> Unit,
              onNotificationClick: () -> Unit,
              onMenuClick: () -> Unit
          ) {
              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(2.dp)
              ) {
                  FeedRadialHeaderAction(
                      imageVector = Icons.Default.Search,
                      contentDescription = "Search people and posts",
                      onClick = onSearchClick,
                      modifier = Modifier.testTag("feed_search_action")
                  )

                  Box(modifier = Modifier.size(44.dp)) {
                      FeedRadialHeaderAction(
                          imageVector = Icons.Default.NotificationsNone,
                          contentDescription = "Notifications",
                          onClick = onNotificationClick,
                          modifier = Modifier
                              .align(Alignment.Center)
                              .testTag("feed_notification_action")
                      )
                      if (hasUnreadNotifications) {
                          Box(
                              modifier = Modifier
                                  .align(Alignment.TopEnd)
                                  .offset(x = (-1).dp, y = 1.dp)
                                  .size(9.dp)
                                  .background(feedAccentBrush(), CircleShape)
                                  .border(1.dp, FeedBackground, CircleShape)
                          )
                      }
                  }

                  FeedRadialHeaderAction(
                      imageVector = Icons.Default.Menu,
                      contentDescription = "Menu",
                      onClick = onMenuClick,
                      modifier = Modifier.testTag("feed_menu_action")
                  )
              }
          }

          @Composable
          private fun FeedRadialHeaderAction('''

          chrome, count = top_pattern.subn(top_replacement, chrome, count=1)
          if count != 1:
              raise SystemExit('Could not locate FeedTopBar block')
          chrome_path.write_text(chrome)

          bottom_path = Path('app/src/main/java/com/example/ui/components/FloatingBottomBar.kt')
          bottom = bottom_path.read_text()
          bottom = require_replace(
              bottom,
              'import androidx.compose.material.icons.filled.Home\n',
              'import androidx.compose.material.icons.filled.Home\nimport androidx.compose.material.icons.filled.Menu\n',
              'bottom Menu import anchor'
          )
          bottom = require_replace(
              bottom,
              'private enum class FeedBottomDestination {\n    HOME, CONNECT, LEADERBOARD, MARKET, MESSAGE\n}',
              'private enum class FeedBottomDestination {\n    HOME, CONNECT, LEADERBOARD, MARKET, MESSAGE, MENU\n}',
              'bottom destination enum'
          )
          bottom = require_replace(
              bottom,
              '    FeedBottomItem(FeedBottomDestination.MESSAGE, Icons.Filled.ChatBubble, Icons.Outlined.ChatBubbleOutline, "Message")\n)',
              '    FeedBottomItem(FeedBottomDestination.MESSAGE, Icons.Filled.ChatBubble, Icons.Outlined.ChatBubbleOutline, "Message"),\n    FeedBottomItem(FeedBottomDestination.MENU, Icons.Filled.Menu, Icons.Filled.Menu, "Menu")\n)',
              'bottom item list'
          )
          bottom = require_replace(
              bottom,
              '    onMessageClick: () -> Unit,\n    isDark: Boolean,\n    modifier: Modifier = Modifier\n)',
              '    onMessageClick: () -> Unit,\n    isDark: Boolean,\n    onMenuClick: () -> Unit = {},\n    isMenuOpen: Boolean = false,\n    modifier: Modifier = Modifier\n)',
              'FeedBottomBar signature'
          )
          bottom = require_replace(
              bottom,
              '    val selectedDestination = when {\n',
              '    val selectedDestination = when {\n        isMenuOpen -> FeedBottomDestination.MENU\n',
              'bottom selected destination'
          )

          bottom, count = re.subn(
              r'(FeedBottomDestination\.MESSAGE\s*->\s*onMessageClick\(\))',
              r'\1\n                                FeedBottomDestination.MENU -> onMenuClick()',
              bottom,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not locate bottom navigation click switch')

          bottom = require_replace(
              bottom,
              '    currentTab: MainTab,\n    onTabSelected: (MainTab) -> Unit,\n    isDark: Boolean,\n    modifier: Modifier = Modifier\n)',
              '    currentTab: MainTab,\n    onTabSelected: (MainTab) -> Unit,\n    isDark: Boolean,\n    onMenuClick: () -> Unit = {},\n    modifier: Modifier = Modifier\n)',
              'FloatingBottomBar wrapper signature'
          )
          bottom = require_replace(
              bottom,
              '        onMessageClick = { onTabSelected(MainTab.MESSAGES) },\n        isDark = isDark,',
              '        onMessageClick = { onTabSelected(MainTab.MESSAGES) },\n        isDark = isDark,\n        onMenuClick = onMenuClick,',
              'FloatingBottomBar wrapper call'
          )
          bottom_path.write_text(bottom)

          main_path = Path('app/src/main/java/com/example/MainActivity.kt')
          main = main_path.read_text()
          main_pattern = re.compile(
              r'^(?P<i>[ \t]*)onMessageClick = \{\n'
              r'(?P=i)    isBottomBarVisibleByScroll = true\n'
              r'(?P=i)    viewModel\.setTab\(MainTab\.MESSAGES\)\n'
              r'(?P=i)\},\n'
              r'(?P=i)isDark = uiState\.isDarkMode$',
              re.M,
          )

          def main_replacement(match):
              i = match.group('i')
              return (
                  f'{i}onMessageClick = {{\n'
                  f'{i}    isBottomBarVisibleByScroll = true\n'
                  f'{i}    viewModel.setTab(MainTab.MESSAGES)\n'
                  f'{i}}},\n'
                  f'{i}isDark = uiState.isDarkMode,\n'
                  f'{i}onMenuClick = {{\n'
                  f'{i}    isBottomBarVisibleByScroll = true\n'
                  f'{i}    viewModel.openMenu(true)\n'
                  f'{i}}},\n'
                  f'{i}isMenuOpen = uiState.isMenuOpen'
              )

          main, count = main_pattern.subn(main_replacement, main, count=1)
          if count != 1:
              raise SystemExit('Could not locate MainActivity bottom navigation wiring')
          main_path.write_text(main)

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          ! grep -q 'text = "B"' app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt
          grep -q 'Icons.Default.Menu' app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt
          grep -q 'FeedBottomDestination.MENU' app/src/main/java/com/example/ui/components/FloatingBottomBar.kt
          grep -q 'isMenuOpen = uiState.isMenuOpen' app/src/main/java/com/example/MainActivity.kt

      - name: Compile app
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Push navigation changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Navigation already matches requested layout.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt \
                  app/src/main/java/com/example/ui/components/FloatingBottomBar.kt \
                  app/src/main/java/com/example/MainActivity.kt
          git commit -m 'Rearrange feed top and bottom navigation'
          git push origin HEAD:main
