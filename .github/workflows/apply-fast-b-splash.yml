name: Apply fast B splash

on:
  push:
    paths:
      - '.github/scripts/apply_fast_b_splash.py'
      - '.github/workflows/apply-fast-b-splash.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply splash update
        run: python .github/scripts/apply_fast_b_splash.py

      - name: Commit and push app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/AuthScreens.kt app/src/main/java/com/example/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "feat: make launch screen a fast animated B"
          git push origin main
