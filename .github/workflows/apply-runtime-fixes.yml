name: Apply runtime fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kotlin fixes
        run: python3 .github/scripts/apply_runtime_fixes.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/supabase/SupabaseService.kt \
                  app/src/main/java/com/example/ui/screens/MessagesScreen.kt \
                  app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt
          if git diff --cached --quiet; then
            echo "No runtime changes needed."
            exit 0
          fi
          git commit -m "fix: apply runtime media auth and call fixes"
          git push origin main
