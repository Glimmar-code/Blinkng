name: Apply runtime fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kotlin fixes
        run: |
          python3 .github/scripts/apply_runtime_fixes.py || echo "apply_runtime_fixes.py reported no applicable change; continuing"
          python3 .github/scripts/apply_account_fix.py || echo "apply_account_fix.py reported no applicable change; continuing"
          python3 .github/scripts/apply_uiux_fixes.py || echo "apply_uiux_fixes.py reported no applicable change; continuing"
          python3 .github/scripts/apply_session_persistence_fix.py || echo "apply_session_persistence_fix.py reported no applicable change; continuing"
          python3 .github/scripts/apply_feed_message_fix.py
          python3 .github/scripts/apply_compile_safety_fixes.py
          python3 .github/scripts/diagnose_compile_errors.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/supabase/SupabaseService.kt \
                  app/src/main/java/com/example/data/supabase/MessageMediaService.kt \
                  app/src/main/java/com/example/data/models/PostModel.kt \
                  app/src/main/java/com/example/data/repository/AuthRepository.kt \
                  app/src/main/java/com/example/ui/screens/MessagesScreen.kt \
                  app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt \
                  app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt \
                  app/src/main/java/com/example/auth/AccountSessionStore.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/ui/screens/FeedScreen.kt \
                  .github/scripts/*.py \
                  .github/workflows/apply-runtime-fixes.yml
          if git diff --cached --quiet; then
            echo "No runtime changes needed."
            exit 0
          fi
          git commit -m "fix: isolate feed and messaging failures"
          git push origin main
