name: Finish Blink VIP surfaces

on:
  push:
    branches: ['feature/blink-coin-store-vip']
    paths:
      - '.github/scripts/finish_blink_vip_surfaces.py'
      - '.github/workflows/finish-blink-vip-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout store branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply VIP surface integration
        run: python3 .github/scripts/finish_blink_vip_surfaces.py

      - name: Validate patch
        run: git diff --check

      - name: Compile Android app
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit completed VIP surfaces
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/components/PostCard.kt \
                  app/src/main/java/com/example/ui/components/CommentSheet.kt \
                  app/src/main/java/com/example/ui/components/StoryBar.kt \
                  app/src/main/java/com/example/ui/screens/ProfileScreen.kt \
                  app/src/main/java/com/example/ui/screens/ActivityScreen.kt \
                  app/src/main/java/com/example/ui/screens/PremiumMessagesScreen.kt \
                  app/src/main/java/com/example/ui/screens/MarketScreen.kt \
                  app/src/main/java/com/example/ui/screens/LeaderboardScreen.kt
          if git diff --cached --quiet; then
            echo "No VIP surface changes needed."
            exit 0
          fi
          git commit -m "feat: surface Blink VIP across identity UI"
          git pull --rebase origin feature/blink-coin-store-vip
          git push origin HEAD:feature/blink-coin-store-vip
