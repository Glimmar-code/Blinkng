name: Integrate Reel route target fix

on:
  push:
    branches:
      - fix/reel-route-target-20260907
    paths:
      - '.github/workflows/integrate-reel-route-target.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare exact patch applicator
        shell: bash
        run: |
          cat > /tmp/apply_reel_route_fix.py <<'PY'
          from pathlib import Path

          def ensure_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one safe match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          vm = "app/src/main/java/com/example/viewmodel/BlinkViewModel.kt"
          main = "app/src/main/java/com/example/MainActivity.kt"
          premium = "app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt"
          reels = "app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt"

          ensure_once(vm,
              "    val feedSubTab: Int = 0,\n    val isOnline: Boolean = true,",
              "    val feedSubTab: Int = 0,\n    val routedReelId: String? = null,\n    val isOnline: Boolean = true,")
          ensure_once(vm,
              "                        _uiState.value = state.copy(\n                            selectedTab = MainTab.HOME,\n                            feedSubTab = 1,\n                            reels = listOf(post) + state.reels.filterNot { it.id == post.id },",
              "                        _uiState.value = state.copy(\n                            selectedTab = MainTab.HOME,\n                            feedSubTab = 1,\n                            routedReelId = post.id,\n                            reels = listOf(post) + state.reels.filterNot { it.id == post.id },")
          ensure_once(vm,
              "                        _uiState.value = state.copy(\n                            selectedTab = MainTab.HOME,\n                            feedSubTab = 0,\n                            posts = listOf(post) + state.posts.filterNot { it.id == post.id },",
              "                        _uiState.value = state.copy(\n                            selectedTab = MainTab.HOME,\n                            feedSubTab = 0,\n                            routedReelId = null,\n                            posts = listOf(post) + state.posts.filterNot { it.id == post.id },")
          ensure_once(vm,
              "                        _uiState.value = state.copy(\n                            selectedTab = MainTab.HOME,\n                            viewingProfile = profile,",
              "                        _uiState.value = state.copy(\n                            selectedTab = MainTab.HOME,\n                            routedReelId = null,\n                            viewingProfile = profile,")
          ensure_once(vm,
              "        _uiState.value = _uiState.value.copy(\n            selectedTab = tab,\n            feedSubTab = nextFeedSubTab,\n            viewingProfile = null,",
              "        _uiState.value = _uiState.value.copy(\n            selectedTab = tab,\n            feedSubTab = nextFeedSubTab,\n            routedReelId = null,\n            viewingProfile = null,")
          ensure_once(vm,
              "    fun setFeedSubTab(tab: Int) {\n        _uiState.value = _uiState.value.copy(feedSubTab = tab.coerceIn(0, 3))\n        persistUiPreferences()\n    }",
              "    fun setFeedSubTab(tab: Int) {\n        _uiState.value = _uiState.value.copy(\n            feedSubTab = tab.coerceIn(0, 3),\n            routedReelId = null\n        )\n        persistUiPreferences()\n    }")
          ensure_once(vm,
              "                _uiState.value = _uiState.value.copy(\n                    selectedTab = MainTab.HOME,\n                    feedSubTab = if (target.isReel) 1 else 0\n                )",
              "                _uiState.value = _uiState.value.copy(\n                    selectedTab = MainTab.HOME,\n                    feedSubTab = if (target.isReel) 1 else 0,\n                    routedReelId = target.id.takeIf { target.isReel }\n                )")
          ensure_once(main,
              "                        currentSubTab = uiState.feedSubTab,\n                        onSubTabChanged = { viewModel.setFeedSubTab(it) },",
              "                        currentSubTab = uiState.feedSubTab,\n                        routedReelId = uiState.routedReelId,\n                        onSubTabChanged = { viewModel.setFeedSubTab(it) },")
          ensure_once(premium,
              "    onBottomBarVisibilityChange: (Boolean) -> Unit = {},\n    hasUnreadNotifications: Boolean = false\n) {",
              "    onBottomBarVisibilityChange: (Boolean) -> Unit = {},\n    hasUnreadNotifications: Boolean = false,\n    routedReelId: String? = null\n) {")
          ensure_once(premium,
              "    var launchReelId by rememberSaveable(resumeUserKey) { mutableStateOf<String?>(null) }\n    var launchReelPositionMs by rememberSaveable(resumeUserKey) { mutableStateOf(0L) }\n\n    fun openReelsAt",
              "    var launchReelId by rememberSaveable(resumeUserKey) { mutableStateOf<String?>(null) }\n    var launchReelPositionMs by rememberSaveable(resumeUserKey) { mutableStateOf(0L) }\n\n    LaunchedEffect(currentSubTab) {\n        if (currentSubTab != 1 && launchReelId != null) {\n            launchReelId = null\n            launchReelPositionMs = 0L\n        }\n    }\n\n    fun openReelsAt")
          ensure_once(premium,
              "            initialReelId = launchReelId,\n            initialReelPositionMs = launchReelPositionMs",
              "            initialReelId = routedReelId ?: launchReelId,\n            initialReelPositionMs = if (routedReelId != null) 0L else launchReelPositionMs")
          ensure_once(reels,
              "    val pager = rememberPagerState(\n        initialPage = initialPage,\n        pageCount = { reels.size }\n    )\n    var pendingLaunchReelId",
              "    val pager = rememberPagerState(\n        initialPage = initialPage,\n        pageCount = { reels.size }\n    )\n\n    LaunchedEffect(initialReelId) {\n        val targetId = initialReelId ?: return@LaunchedEffect\n        val targetIndex = reels.indexOfFirst { it.id == targetId }\n        if (targetIndex >= 0 && pager.currentPage != targetIndex) {\n            pager.scrollToPage(targetIndex)\n        }\n    }\n\n    var pendingLaunchReelId")
          PY

      - name: Build, verify, and safely push latest candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prepare_candidate() {
            git fetch origin main
            git checkout --detach origin/main
            python /tmp/apply_reel_route_fix.py
            git add \
              app/src/main/java/com/example/MainActivity.kt \
              app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
              app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt \
              app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "Reel route fix is already present on latest main."
            else
              git commit -m "fix: route shared reels to exact target"
            fi
          }

          verify_candidate() {
            gradle :app:testDebugUnitTest --stacktrace --no-daemon
            gradle :app:lintDebug --stacktrace --no-daemon
            gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon
            gradle :app:assembleDebug --stacktrace --no-daemon
          }

          prepare_candidate
          verify_candidate

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main advanced; rebuilding the exact Reel fix on the new main head"
              prepare_candidate
              verify_candidate
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe push raced with another main update; retrying ($attempt/5)"
          done

          echo "main kept advancing during all safe push attempts"
          exit 1
