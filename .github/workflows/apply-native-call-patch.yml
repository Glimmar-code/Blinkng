name: Apply native call button patch

on:
  push:
    branches:
      - fix/native-chat-calls-20260907
    paths:
      - .github/workflows/apply-native-call-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-chat-calls-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace legacy Jitsi call launchers
        run: python .github/scripts/apply_native_call_buttons.py
      - name: Verify and commit patched source
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- app/src/main/java/com/example/ui/screens/MessagesScreen.kt app/src/main/java/com/example/ui/screens/PremiumMessagesScreen.kt; then
            echo "Native call buttons are already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/MessagesScreen.kt app/src/main/java/com/example/ui/screens/PremiumMessagesScreen.kt
          git commit -m "Wire chat call buttons to native WebRTC"
          git push origin HEAD:fix/native-chat-calls-20260907
