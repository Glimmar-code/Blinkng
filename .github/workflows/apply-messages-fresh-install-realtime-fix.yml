name: Apply messages fresh install realtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_messages_fresh_install_realtime_fix.py'
      - '.github/workflows/apply-messages-fresh-install-realtime-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: messages-fresh-install-realtime-main
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply messaging patch
        run: python3 .github/scripts/apply_messages_fresh_install_realtime_fix.py

      - name: Verify Kotlin compilation
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'blink-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/java/com/example/ui/screens/PremiumMessagesScreen.kt \
                  app/src/main/java/com/example/MainActivity.kt
          git commit -m 'Fix fresh install chat history and realtime list'
          git pull --rebase origin main
          git push origin HEAD:main
