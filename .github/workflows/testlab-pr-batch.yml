# Trusted main-only auto-discovery queue. Never check out PR heads with write permission.
name: BLINK multi-PR Testlab batch integration

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: blink-safe-testlab-batch
  cancel-in-progress: false

jobs:
  integrate-or-verify:
    if: github.repository == 'Glimmar-code/Blinkng'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted controller on main, never a PR checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Detect eligible green PRs, combine in Testlab, or verify active batch
        uses: actions/github-script@v7
        with:
          script: |
            const queue = require('./.github/scripts/testlab_batch_queue.cjs');
            await queue({github, context, core});
