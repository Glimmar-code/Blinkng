name: Verify BLINK live custom domain

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Blink web"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public DNS, HTTPS, privacy, AdMob and Android links
        run: node scripts/check_blink_domain_live.mjs
