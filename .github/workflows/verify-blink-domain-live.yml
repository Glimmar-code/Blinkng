name: Verify BLINK live custom domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public DNS, HTTPS, privacy, AdMob and Android links
        run: node scripts/check_blink_domain_live.mjs
