name: Apply share deep link and timestamp fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_share_deeplink_time_fix.py'
      - '.github/workflows/apply-share-deeplink-time-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize patch matcher
        run: sed -i 's/if count < 2:/if count < 1:/' .github/scripts/apply_share_deeplink_time_fix.py

      - name: Apply share and deep link integration
        run: python3 .github/scripts/apply_share_deeplink_time_fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/apply_share_deeplink_time_fix.py \
                  app/build.gradle.kts \
                  app/src/main/AndroidManifest.xml \
                  app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/data/repository/PostRepository.kt \
                  app/src/main/java/com/example/data/repository/ChatRepository.kt \
                  app/src/main/java/com/example/data/supabase/SupabaseService.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/java/com/example/ui/screens/ProfileScreen.kt \
                  app/src/main/java/com/example/ui/components/PostOptionsMenuSheet.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "feat: add share links deep routing and richer timestamps"
          git push origin main
