name: Apply repost and game ranking changes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_repost_game_ranking.py'
      - '.github/workflows/apply-repost-game-ranking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply source patch
        run: python3 .github/scripts/apply_repost_game_ranking.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/data/models/PostModel.kt \
            app/src/main/java/com/example/data/repository/PostRepository.kt \
            app/src/main/java/com/example/data/supabase/SupabaseService.kt \
            app/src/main/java/com/example/ui/components/PostCard.kt \
            app/src/main/java/com/example/ui/screens/FeedScreen.kt \
            app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
            app/src/main/java/com/example/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add repost distribution and game-only ranking"
          git pull --rebase origin main
          git push origin HEAD:main
