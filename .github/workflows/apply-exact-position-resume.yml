name: Apply exact feed and reel resume position

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_exact_position_resume.py'
      - '.github/scripts/fix_exact_resume_context.py'
      - '.github/workflows/apply-exact-position-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact resume patch
        run: |
          python3 .github/scripts/apply_exact_position_resume.py
          python3 .github/scripts/fix_exact_resume_context.py

      - name: Compile Android app
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/exact-resume-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-resume-build-log
          path: /tmp/exact-resume-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit and push generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
                  app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt
          git commit -m "fix: resume feed and reels at last position"
          git pull --rebase origin main
          git push origin HEAD:main
