name: Apply reel gesture and aspect fixes

on:
  push:
    paths:
      - '.github/workflows/apply-reel-gesture-aspect-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply gesture and aspect changes
        run: python .github/scripts/apply_reel_gesture_aspect_fix.py
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/FeedScreen.kt app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: correct swipe gestures and preserve reel aspect"
            git push origin HEAD:main
          fi
