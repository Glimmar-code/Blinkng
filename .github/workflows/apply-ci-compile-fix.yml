name: Apply CI compile fix

on:
  push:
    branches:
      - fix/feed-discover-follow-navigation
    paths:
      - .github/workflows/apply-ci-compile-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feed-discover-follow-navigation
          fetch-depth: 0

      - name: Patch Kotlin compile errors
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          chrome = Path("app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt")
          s = chrome.read_text()
          s = replace_once(
              s,
              "        val actionsWidth = if (maxWidth < 360.dp) 88.dp else 106.dp\n        val tabWidth = (maxWidth - actionsWidth) / 3\n",
              "        val availableWidth = maxWidth\n        val actionsWidth = if (availableWidth < 360.dp) 88.dp else 106.dp\n        val tabWidth = (availableWidth - actionsWidth) / 3\n",
              "capture BoxWithConstraints width"
          )
          s = s.replace(".width(if (maxWidth < 360.dp) 44.dp else 58.dp)", ".width(if (availableWidth < 360.dp) 44.dp else 58.dp)", 1)
          s = s.replace("if (maxWidth >= 390.dp) {", "if (availableWidth >= 390.dp) {", 1)
          s = s.replace(".width(if (maxWidth < 360.dp) 44.dp else 48.dp)", ".width(if (availableWidth < 360.dp) 44.dp else 48.dp)", 1)
          chrome.write_text(s)

          search = Path("app/src/main/java/com/example/ui/screens/SearchScreen.kt")
          s = search.read_text()
          s = replace_once(
              s,
              "import androidx.compose.runtime.remember\n",
              "import androidx.compose.runtime.remember\nimport androidx.compose.runtime.rememberCoroutineScope\n",
              "rememberCoroutineScope import"
          )
          s = replace_once(
              s,
              "    val dragOffset = remember { Animatable(0f) }\n    val dismissThresholdPx = with(density) { 96.dp.toPx() }\n",
              "    val dragOffset = remember { Animatable(0f) }\n    val gestureScope = rememberCoroutineScope()\n    val dismissThresholdPx = with(density) { 96.dp.toPx() }\n",
              "gesture coroutine scope"
          )
          s = s.replace("                            launch {\n                                dragOffset.snapTo", "                            gestureScope.launch {\n                                dragOffset.snapTo", 1)
          s = s.replace("                            launch {\n                                if (dragOffset.value", "                            gestureScope.launch {\n                                if (dragOffset.value", 1)
          s = s.replace("                            launch {\n                                dragOffset.animateTo", "                            gestureScope.launch {\n                                dragOffset.animateTo", 1)
          search.write_text(s)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "Blink CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/components/PremiumFeedChrome.kt app/src/main/java/com/example/ui/screens/SearchScreen.kt
          git commit -m "Fix Compose scope compilation"
          git push origin HEAD:fix/feed-discover-follow-navigation
