name: One-shot call audio focus hardening

on:
  push:
    branches:
      - fix/native-chat-calls-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-chat-calls-20260907
      - name: Add Android call audio focus lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/call/WebRtcCallClient.kt")
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit("Expected WebRtcCallClient source block not found")
              text = text.replace(old, new, 1)

          replace_once(
              "import android.media.AudioDeviceInfo\nimport android.media.AudioManager\n",
              "import android.media.AudioAttributes\nimport android.media.AudioDeviceInfo\nimport android.media.AudioFocusRequest\nimport android.media.AudioManager\n",
          )

          replace_once(
              "    private val audioManager = appContext.getSystemService(Context.AUDIO_SERVICE) as AudioManager\n    private val audioDeviceModule: AudioDeviceModule\n",
              "    private val audioManager = appContext.getSystemService(Context.AUDIO_SERVICE) as AudioManager\n    private val audioFocusListener = AudioManager.OnAudioFocusChangeListener { }\n    private var audioFocusRequest: AudioFocusRequest? = null\n    private val audioDeviceModule: AudioDeviceModule\n",
          )

          replace_once(
              "        audioManager.mode = AudioManager.MODE_IN_COMMUNICATION\n        setSpeakerEnabled(speakerEnabled)\n",
              "        audioManager.mode = AudioManager.MODE_IN_COMMUNICATION\n        requestCallAudioFocus()\n        setSpeakerEnabled(speakerEnabled)\n",
          )

          replace_once(
              "        audioManager.mode = AudioManager.MODE_NORMAL\n    }\n\n    private fun initializeFactoryOnce() {\n",
              "        abandonCallAudioFocus()\n        audioManager.mode = AudioManager.MODE_NORMAL\n    }\n\n    private fun requestCallAudioFocus() {\n        val result = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            val request = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)\n                .setAudioAttributes(\n                    AudioAttributes.Builder()\n                        .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)\n                        .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)\n                        .build()\n                )\n                .setOnAudioFocusChangeListener(audioFocusListener)\n                .build()\n            audioFocusRequest = request\n            audioManager.requestAudioFocus(request)\n        } else {\n            @Suppress(\"DEPRECATION\")\n            audioManager.requestAudioFocus(\n                audioFocusListener,\n                AudioManager.STREAM_VOICE_CALL,\n                AudioManager.AUDIOFOCUS_GAIN_TRANSIENT\n            )\n        }\n        if (result != AudioManager.AUDIOFOCUS_REQUEST_GRANTED) {\n            Log.w(TAG, \"Call audio focus was not granted\")\n        }\n    }\n\n    private fun abandonCallAudioFocus() {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            audioFocusRequest?.let { request ->\n                runCatching { audioManager.abandonAudioFocusRequest(request) }\n            }\n            audioFocusRequest = null\n        } else {\n            @Suppress(\"DEPRECATION\")\n            runCatching { audioManager.abandonAudioFocus(audioFocusListener) }\n        }\n    }\n\n    private fun initializeFactoryOnce() {\n",
          )

          path.write_text(text)
          final = path.read_text()
          assert "requestCallAudioFocus()" in final
          assert "abandonCallAudioFocus()" in final
          assert "USAGE_VOICE_COMMUNICATION" in final
          assert "AudioFocusRequest.Builder" in final
          PY
      - name: Commit audio focus fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-call-audio-focus.yml
          git add app/src/main/java/com/example/call/WebRtcCallClient.kt
          git commit -m "Handle native call audio focus"
          git push origin HEAD:fix/native-chat-calls-20260907
