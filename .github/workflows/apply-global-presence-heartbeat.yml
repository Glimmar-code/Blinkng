name: Apply app-wide presence heartbeat

on:
  push:
    branches:
      - fix/navigation-build-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-build-runtime
          fetch-depth: 0

      - name: Move presence lease heartbeat to app lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          main = Path('app/src/main/java/com/example/MainActivity.kt')
          m = main.read_text()
          m = once(m,
              'import androidx.lifecycle.compose.collectAsStateWithLifecycle\n',
              'import androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport androidx.lifecycle.lifecycleScope\n',
              'MainActivity lifecycleScope import')
          m = once(m,
              'import kotlinx.coroutines.flow.collectLatest\n',
              'import kotlinx.coroutines.Job\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.collectLatest\nimport kotlinx.coroutines.isActive\nimport kotlinx.coroutines.launch\n',
              'MainActivity coroutine imports')
          m = once(m,
              'class MainActivity : ComponentActivity() {\n\n    private val viewModel: BlinkViewModel by viewModels()\n',
              '''class MainActivity : ComponentActivity() {\n\n    private val viewModel: BlinkViewModel by viewModels()\n    private var presenceHeartbeatJob: Job? = null\n\n    private fun startPresenceHeartbeat() {\n        presenceHeartbeatJob?.cancel()\n        if (viewModel.uiState.value.destination != AppDestination.MAIN) return\n        presenceHeartbeatJob = lifecycleScope.launch {\n            while (isActive && viewModel.uiState.value.destination == AppDestination.MAIN) {\n                viewModel.updatePresence(true)\n                delay(60_000)\n            }\n        }\n    }\n\n    private fun stopPresenceHeartbeat(markOffline: Boolean) {\n        presenceHeartbeatJob?.cancel()\n        presenceHeartbeatJob = null\n        if (markOffline && viewModel.uiState.value.destination == AppDestination.MAIN) {\n            viewModel.updatePresence(false)\n        }\n    }\n''',
              'MainActivity presence heartbeat members')
          m = once(m,
              '''    override fun onResume() {\n        super.onResume()\n        if (viewModel.uiState.value.destination == AppDestination.MAIN) {\n            viewModel.refreshIfStale()\n        }\n    }\n\n    override fun onStop() {\n        if (viewModel.uiState.value.destination == AppDestination.MAIN) {\n            viewModel.updatePresence(false)\n        }\n        super.onStop()\n    }\n''',
              '''    override fun onResume() {\n        super.onResume()\n        if (viewModel.uiState.value.destination == AppDestination.MAIN) {\n            viewModel.refreshIfStale()\n            startPresenceHeartbeat()\n        }\n    }\n\n    override fun onStop() {\n        stopPresenceHeartbeat(markOffline = true)\n        super.onStop()\n    }\n''',
              'MainActivity resume/stop lifecycle')
          m = once(m,
              '''        setContent {\n            val uiState by viewModel.uiState.collectAsStateWithLifecycle()\n            val snackbarHostState = remember { SnackbarHostState() }\n''',
              '''        setContent {\n            val uiState by viewModel.uiState.collectAsStateWithLifecycle()\n            val snackbarHostState = remember { SnackbarHostState() }\n\n            LaunchedEffect(uiState.destination) {\n                if (uiState.destination == AppDestination.MAIN) {\n                    startPresenceHeartbeat()\n                } else {\n                    stopPresenceHeartbeat(markOffline = false)\n                }\n            }\n''',
              'MainActivity destination heartbeat hook')
          main.write_text(m)

          feed = Path('app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt')
          f = feed.read_text()
          f = f.replace('import com.example.data.supabase.SupabaseService\n', '')
          f = once(f,
              '''    val followingIds by FollowStateStore.followingIds.collectAsState()\n    val presenceService = remember { SupabaseService() }\n\n    LaunchedEffect(currentUsername) {\n        if (currentUsername.isNotBlank()) FollowStateStore.refresh()\n        while (isActive && currentUsername.isNotBlank()) {\n            runCatching { presenceService.setMyPresence(true) }\n            delay(60_000)\n        }\n    }\n''',
              '''    val followingIds by FollowStateStore.followingIds.collectAsState()\n\n    LaunchedEffect(currentUsername) {\n        if (currentUsername.isNotBlank()) FollowStateStore.refresh()\n    }\n''',
              'PremiumFeedScreen feed-only heartbeat')
          if 'delay(' not in f:
              f = f.replace('import kotlinx.coroutines.delay\n', '')
          if 'isActive' not in f.replace('import kotlinx.coroutines.isActive\n', ''):
              f = f.replace('import kotlinx.coroutines.isActive\n', '')
          feed.write_text(f)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt
          git commit -m "fix: keep presence accurate across all app tabs"
          git push origin HEAD:fix/navigation-build-runtime
