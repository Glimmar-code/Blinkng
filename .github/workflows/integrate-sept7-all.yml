name: Integrate Sep 7 branches safely

on:
  push:
    branches:
      - automation/integrate-sept7-all
    paths:
      - '.github/workflows/integrate-sept7-all.yml'

permissions:
  contents: write

jobs:
  merge-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up merge workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B integration-sept7 origin/main
          echo "Starting from $(git rev-parse HEAD)"

      - name: Merge remaining Sep 7 work and report next real conflict
        shell: bash
        run: |
          set -euo pipefail

          report_conflict() {
            local branch="$1"
            echo "::error::Conflict while merging $branch"
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U || true
            echo "Status:"
            git status --short || true
            echo "Conflict excerpts:"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "----- $file -----"
              git diff --cc -- "$file" | sed -n '1,360p' || true
            done < <(git diff --name-only --diff-filter=U)
          }

          merge_one() {
            local branch="$1"
            echo ""
            echo "===== MERGE $branch ====="
            if git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "$branch is already contained in the integration tree"
              return 0
            fi
            if git merge --no-ff --no-edit "origin/$branch"; then
              echo "Merged $branch"
              return 0
            fi
            report_conflict "$branch"
            exit 10
          }

          merge_auth() {
            local branch="fix/auth-google-reset-account-switch"
            echo ""
            echo "===== MERGE $branch ====="
            if git merge --no-ff --no-edit "origin/$branch"; then
              echo "Merged $branch"
              return 0
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "app/src/main/AndroidManifest.xml"
              "app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt"
              "app/src/main/java/com/example/auth/GoogleNonce.kt"
            )
            if [ "${#conflicts[@]}" -ne 3 ]; then
              report_conflict "$branch"
              exit 10
            fi
            for expected_file in "${expected[@]}"; do
              if ! printf '%s\n' "${conflicts[@]}" | grep -Fxq "$expected_file"; then
                report_conflict "$branch"
                exit 10
              fi
            done

            # main already has the same raw/SHA-256 nonce contract plus the newer
            # GoogleAuthLaunchGate cleanup, so retain those newer implementations.
            git checkout --ours -- \
              app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt \
              app/src/main/java/com/example/auth/GoogleNonce.kt \
              app/src/main/AndroidManifest.xml

            # The unique auth-branch addition is the reset-password deep-link activity.
            python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          text = p.read_text()
          if '.auth.PasswordResetActivity' not in text:
              block = '''        <activity
                      android:name=".auth.PasswordResetActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.MyApplication">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="blink"
                              android:host="auth"
                              android:path="/reset-password" />
                      </intent-filter>
                  </activity>
          '''
              anchor = '        <service\n            android:name=".notification.BlinkFirebaseMessagingService"'
              if anchor not in text:
                  raise SystemExit('Could not find Firebase service anchor in AndroidManifest.xml')
              text = text.replace(anchor, block + anchor, 1)
              p.write_text(text)
          PY

            git add \
              app/src/main/AndroidManifest.xml \
              app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt \
              app/src/main/java/com/example/auth/GoogleNonce.kt
            git commit --no-edit
            echo "Resolved and merged $branch"
          }

          # Already merged to main earlier today: fix/post-like-speed-reliability, game-professional-overhaul.
          merge_auth
          merge_one feature/admin-control-center-v3
          merge_one feature/connect-vertical-directory-20
          merge_one fix/professional-notifications-20260907
          merge_one fix/reel-route-target-20260907
          merge_one feature/professional-search-discover
          merge_one leaderboard-top10-professional
          merge_one fix/verified-name-consistency
          merge_one feature/windows-desktop-foundation
          merge_one supabase-recovery-20260907

          echo "All remaining branches merged cleanly"
          git --no-pager log --oneline --decorate -25

      - name: Set up Java 17
        if: success()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: success()
        uses: gradle/actions/setup-gradle@v4

      - name: Android quality gate
        if: success()
        run: |
          gradle :app:compileDebugKotlin --stacktrace --no-daemon
          gradle :app:testDebugUnitTest --stacktrace --no-daemon
          gradle :app:lintDebug --stacktrace --no-daemon
          gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Push integration result branch
        if: success()
        run: |
          git push --force-with-lease origin HEAD:refs/heads/automation/integration-sept7-result
