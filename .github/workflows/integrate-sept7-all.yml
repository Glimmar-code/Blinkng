name: Integrate Sep 7 branches safely

on:
  push:
    branches: [automation/integrate-sept7-all]
    paths:
      - '.github/workflows/integrate-sept7-all.yml'
      - '.github/scripts/integrate_sept7.sh'

permissions:
  contents: write

concurrency:
  group: integrate-sept7-main
  cancel-in-progress: true

jobs:
  merge-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Sep 7 work from latest main
        run: bash .github/scripts/integrate_sept7.sh

      - name: Verify shared module wiring
        run: |
          grep -Fq 'include(":shared")' settings.gradle.kts
          grep -Fq 'implementation(project(":shared"))' app/build.gradle.kts
          test -f shared/build.gradle.kts
          test -f shared/src/main/kotlin/com/blinkng/shared/BlinkBackendDefaults.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android quality gate
        run: |
          gradle \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebugAndroidTest \
            :app:assembleDebug \
            --stacktrace --no-daemon

      - name: Push validated integration branch
        run: git push --force-with-lease origin HEAD:refs/heads/automation/integration-sept7-final

  windows-parity:
    needs: merge-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/integration-sept7-final
          fetch-depth: 0
      - name: Enforce Android-Windows feature parity
        run: python3 scripts/check_windows_parity.py

  windows-build:
    needs: merge-and-check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/integration-sept7-final
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Compile, test and package Windows app
        run: gradle -p desktopApp build packageExe packageMsi --stacktrace --no-daemon

  push-main:
    needs: [merge-and-check, windows-parity, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/integration-sept7-final
          fetch-depth: 0
      - name: Push validated integration to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main advanced after integration; refusing to overwrite it"
            exit 1
          fi
          git push origin HEAD:main
