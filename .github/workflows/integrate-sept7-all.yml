name: Integrate Sep 7 branches safely

on:
  push:
    branches: [automation/integrate-sept7-all]
    paths: ['.github/workflows/integrate-sept7-all.yml']

permissions:
  contents: write

jobs:
  merge-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up merge workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B integration-sept7 origin/main

      - name: Merge remaining Sep 7 work
        shell: bash
        run: |
          set -euo pipefail

          report_conflict() {
            local branch="$1"
            echo "::error::Conflict while merging $branch"
            git diff --name-only --diff-filter=U || true
            git status --short || true
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "----- $file -----"
              git diff --cc -- "$file" | sed -n '1,380p' || true
            done < <(git diff --name-only --diff-filter=U)
          }

          merge_one() {
            local branch="$1"
            echo "===== MERGE $branch ====="
            if git merge-base --is-ancestor "origin/$branch" HEAD; then return 0; fi
            if git merge --no-ff --no-edit "origin/$branch"; then return 0; fi
            report_conflict "$branch"
            exit 10
          }

          merge_auth() {
            local branch="fix/auth-google-reset-account-switch"
            echo "===== MERGE $branch ====="
            if git merge --no-ff --no-edit "origin/$branch"; then return 0; fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=("app/src/main/AndroidManifest.xml" "app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt" "app/src/main/java/com/example/auth/GoogleNonce.kt")
            [ "${#conflicts[@]}" -eq 3 ] || { report_conflict "$branch"; exit 10; }
            for f in "${expected[@]}"; do printf '%s\n' "${conflicts[@]}" | grep -Fxq "$f" || { report_conflict "$branch"; exit 10; }; done
            git checkout --ours -- app/src/main/AndroidManifest.xml app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt app/src/main/java/com/example/auth/GoogleNonce.kt
            python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/AndroidManifest.xml'); text=p.read_text()
          if '.auth.PasswordResetActivity' not in text:
              block='''        <activity
                      android:name=".auth.PasswordResetActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.MyApplication">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="blink" android:host="auth" android:path="/reset-password" />
                      </intent-filter>
                  </activity>
          '''
              anchor='        <service\n            android:name=".notification.BlinkFirebaseMessagingService"'
              if anchor not in text: raise SystemExit('Firebase service anchor missing')
              p.write_text(text.replace(anchor,block+anchor,1))
          PY
            git add app/src/main/AndroidManifest.xml app/src/main/java/com/example/auth/GoogleAuthCallbackActivity.kt app/src/main/java/com/example/auth/GoogleNonce.kt
            git commit --no-edit
          }

          merge_admin() {
            local branch="feature/admin-control-center-v3"
            echo "===== MERGE $branch ====="
            if git merge --no-ff --no-edit "origin/$branch"; then return 0; fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "app/src/main/java/com/example/AdminControlCenterActivity.kt" ] || { report_conflict "$branch"; exit 10; }
            # V3 is the full implementation; it already preserves current Supabase initialization and BlinkTheme.
            git checkout --theirs -- app/src/main/java/com/example/AdminControlCenterActivity.kt
            git add app/src/main/java/com/example/AdminControlCenterActivity.kt
            git commit --no-edit
          }

          # Already merged to main: fix/post-like-speed-reliability, game-professional-overhaul.
          merge_auth
          merge_admin
          merge_one feature/connect-vertical-directory-20
          merge_one fix/professional-notifications-20260907
          merge_one fix/reel-route-target-20260907
          merge_one feature/professional-search-discover
          merge_one leaderboard-top10-professional
          merge_one fix/verified-name-consistency
          merge_one feature/windows-desktop-foundation
          merge_one supabase-recovery-20260907

          git --no-pager log --oneline --decorate -25

      - name: Set up Java 17
        if: success()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: success()
        uses: gradle/actions/setup-gradle@v4

      - name: Android quality gate
        if: success()
        run: |
          gradle :app:compileDebugKotlin --stacktrace --no-daemon
          gradle :app:testDebugUnitTest --stacktrace --no-daemon
          gradle :app:lintDebug --stacktrace --no-daemon
          gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Push integration result branch
        if: success()
        run: git push --force-with-lease origin HEAD:refs/heads/automation/integration-sept7-result
