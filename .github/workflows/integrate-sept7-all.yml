name: Integrate Sep 7 branches safely

on:
  push:
    branches: [automation/integrate-sept7-all]
    paths:
      - '.github/workflows/integrate-sept7-all.yml'
      - '.github/scripts/integrate_sept7.sh'

permissions:
  contents: write

jobs:
  merge-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Sep 7 work
        run: bash .github/scripts/integrate_sept7.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android quality gate
        run: |
          gradle :app:compileDebugKotlin --stacktrace --no-daemon
          gradle :app:testDebugUnitTest --stacktrace --no-daemon
          gradle :app:lintDebug --stacktrace --no-daemon
          gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Push integration result branch
        run: git push --force-with-lease origin HEAD:refs/heads/automation/integration-sept7-result
