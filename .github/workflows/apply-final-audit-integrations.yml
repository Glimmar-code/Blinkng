          print('Final audit integration patch applied successfully.')
          PY

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Commit validated integrations
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "Glimmar"
          git config user.email "golowosile@gmail.com"
          git add app gradle/libs.versions.toml
          git commit -m "feat: finish audited scheduling study and offline integrations"
          git push origin HEAD:main
