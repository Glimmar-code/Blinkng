name: BLINK calling main integration checks

on:
  push:
    branches:
      - 'release/calls-phase5-safe-integration-20261018'
      - 'Testlab-call-*'
    paths:
      - '.github/workflows/calls-main-integration-check.yml'
      - 'app/src/main/java/com/example/call/**'
      - 'app/src/test/java/com/example/call/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calls-main-integration-check.yml'
      - 'app/src/main/java/com/example/call/**'
      - 'app/src/test/java/com/example/call/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blink-calling-main-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-call-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android app Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run calling policy unit tests
        run: gradle :app:testDebugUnitTest --tests 'com.example.call.*' --no-daemon --stacktrace
