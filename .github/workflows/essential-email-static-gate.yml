name: Essential email static safety

on:
  push:
    branches:
      - Testlab-essential-email-phase1-20261016
    paths:
      - 'supabase/templates/**'
      - 'supabase/tests/test_essential_email_templates.py'
      - 'supabase/functions/send-essential-email/**'
      - 'supabase/functions/unsubscribe-social-email/**'
      - 'supabase/migrations/20261016093000_blink_essential_email_outbox.sql'
      - 'supabase/migrations/20261016120000_blink_opt_in_social_email.sql'
      - 'app/src/main/java/com/example/notification/BlinkSocialEmailPreferencesClient.kt'
      - 'app/src/main/java/com/example/notification/NotificationAndCallSettingsActivity.kt'
      - 'desktopApp/src/main/kotlin/com/blinkng/desktop/data/DesktopSupabaseClient.kt'
      - 'desktopApp/src/main/kotlin/com/blinkng/desktop/ui/ContentScreens.kt'
      - 'shared/src/main/kotlin/com/blinkng/shared/notification/BlinkSocialEmailCategory.kt'
      - 'supabase/config.toml'
      - '.github/workflows/essential-email-static-gate.yml'
  pull_request:
    branches:
      - Testlab
    paths:
      - 'supabase/templates/**'
      - 'supabase/tests/test_essential_email_templates.py'
      - 'supabase/functions/send-essential-email/**'
      - 'supabase/functions/unsubscribe-social-email/**'
      - 'supabase/migrations/20261016093000_blink_essential_email_outbox.sql'
      - 'supabase/migrations/20261016120000_blink_opt_in_social_email.sql'
      - 'app/src/main/java/com/example/notification/BlinkSocialEmailPreferencesClient.kt'
      - 'app/src/main/java/com/example/notification/NotificationAndCallSettingsActivity.kt'
      - 'desktopApp/src/main/kotlin/com/blinkng/desktop/data/DesktopSupabaseClient.kt'
      - 'desktopApp/src/main/kotlin/com/blinkng/desktop/ui/ContentScreens.kt'
      - 'shared/src/main/kotlin/com/blinkng/shared/notification/BlinkSocialEmailCategory.kt'
      - 'supabase/config.toml'
      - '.github/workflows/essential-email-static-gate.yml'

permissions:
  contents: read

jobs:
  essential-email-static:
    name: templates and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated email safety tests
        run: python3 -m unittest discover -s supabase/tests -p 'test_essential_email_templates.py' -v
      - name: Install Deno for Edge Function type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check email Edge Functions
        run: deno check supabase/functions/send-essential-email/index.ts supabase/functions/unsubscribe-social-email/index.ts
