name: Testlab Call Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "supabase/functions/call-turn-credentials/**"
      - "supabase/config.toml"
      - ".github/workflows/testlab-call-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testlab-call-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-call-quality:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'Testlab-call-professional-v1-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Call unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Debug APK compile
        run: ./gradlew :app:assembleDebug --stacktrace
