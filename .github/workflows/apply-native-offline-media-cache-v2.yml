name: Apply native offline media cache v2

on:
  push:
    paths:
      - '.github/scripts/apply_native_offline_media_cache_v2.py'
      - '.github/workflows/apply-native-offline-media-cache-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply native offline persistence patch
        run: python .github/scripts/apply_native_offline_media_cache_v2.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run offline cache tests
        run: gradle :app:testDebugUnitTest --tests com.example.data.local.OfflineContentCodecTest --stacktrace --no-daemon

      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/BlinkApplication.kt \
            app/src/main/java/com/example/data/local/BlinkMediaCache.kt \
            app/src/main/java/com/example/data/local/CachedContent.kt \
            app/src/main/java/com/example/data/local/OfflineContentStore.kt \
            app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt
          git commit -m 'fix: make feed media and chats persist offline'
          git push origin HEAD:main
