name: Remove duplicate Connect and Game nav

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_connect_game_duplicate_nav.py'
      - '.github/workflows/remove-connect-game-duplicate-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove duplicate navigation rows
        run: python3 .github/scripts/remove_connect_game_duplicate_nav.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/ConnectSection.kt \
                  app/src/main/java/com/example/ui/screens/GameSection.kt
          git rm .github/scripts/remove_connect_game_duplicate_nav.py \
                 .github/workflows/remove-connect-game-duplicate-nav.yml
          git commit -m "fix: remove duplicate nav from Connect and Game"
          git push origin main
