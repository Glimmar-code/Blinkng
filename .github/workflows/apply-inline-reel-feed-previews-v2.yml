name: Apply inline reel feed previews v2

on:
  push:
    paths:
      - '.github/workflows/apply-inline-reel-feed-previews-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply inline reel feed previews
        run: python .github/scripts/apply_inline_reel_feed_previews_v2.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
            app/src/main/java/com/example/ui/screens/FeedScreen.kt \
            app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: apply shared view tracking to inline reels"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            echo "Could not push source changes after retries"
            exit 1
          fi

# Triggered after view-pipeline alignment; source is compiled before push.
