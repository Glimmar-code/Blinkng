name: Apply account-scoped chat cache v4

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_account_scoped_chat_cache_v4.py'
      - '.github/workflows/apply-account-scoped-chat-cache-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: account-scoped-chat-cache-main
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply composite account cache patch
        run: python3 .github/scripts/apply_account_scoped_chat_cache_v4.py

      - name: Verify Kotlin compilation
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Commit verified cache hardening
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'blink-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/example/data/local/CachedContent.kt \
                  app/src/main/java/com/example/data/local/OfflineContentStore.kt
          git commit -m 'Make chat cache fully account scoped'
          git pull --rebase origin main
          git push origin HEAD:main

# This workflow intentionally compiles and tests the cache migration before pushing it.
