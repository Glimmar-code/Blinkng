name: Apply weighted discovery feed source fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-weighted-discovery-feed-source.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/fix_weighted_discovery_feed.py

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/supabase/SupabaseService.kt app/src/main/java/com/example/data/repository/PostRepository.kt
          git commit -m "fix: use weighted discovery ranking in feed"
          git pull --rebase origin main
          git push origin main
