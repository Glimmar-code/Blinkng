name: Apply legacy feed cleanup

on:
  push:
    branches: [chatgpt/remove-legacy-feed]
    paths:
      - '.github/scripts/legacy_feed_cleanup.py'
      - '.github/workflows/apply-legacy-feed-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-legacy-feed
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/scripts/legacy_feed_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove legacy feed implementation" || exit 0
          git push origin HEAD:chatgpt/remove-legacy-feed
