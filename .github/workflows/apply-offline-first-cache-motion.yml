name: Apply offline-first cache and restrained feed motion

on:
  push:
    paths:
      - '.github/scripts/apply_offline_first_cache_motion.py'
      - '.github/workflows/apply-offline-first-cache-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply offline-first patch
        run: python .github/scripts/apply_offline_first_cache_motion.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run offline cache regression test
        run: gradle :app:testDebugUnitTest --tests com.example.data.local.OfflineContentCodecTest --stacktrace --no-daemon

      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/data/local/OfflineContentStore.kt \
            app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
            app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
            app/src/test/java/com/example/data/local/OfflineContentCodecTest.kt
          git commit -m 'fix: make app cache-first offline and smooth feed motion'
          git push origin HEAD:main
