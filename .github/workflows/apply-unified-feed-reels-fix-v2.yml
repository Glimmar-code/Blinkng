name: Apply unified feed reels fix v2

on:
  push:
    branches:
      - fix/unified-feed-reels-views

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-feed-reels-views
          fetch-depth: 0

      - name: Apply patch script
        run: python3 scripts/apply_unified_feed_reels_fix.py

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/supabase/SupabaseService.kt \
                  app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt \
                  app/src/main/java/com/example/ui/screens/FeedScreen.kt \
                  app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
                  app/src/main/java/com/example/ui/components/PostCard.kt \
                  app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/ui/screens/ProfileScreen.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
          git commit -m "fix: unify feed reels views and profile separation"
          git push origin HEAD:fix/unified-feed-reels-views
