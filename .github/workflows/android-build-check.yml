name: Android quality gate

# Keep this gate explicit for main-branch integration validation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --no-daemon
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== FULL LINT REPORT ====="
              cat "$report"
            fi
          fi
          exit "$status"

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify native BLINK LIFE is actually packaged
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/blink-apk-entry-list.txt"
          for file in assets/project.godot assets/scenes/main.tscn assets/scripts/world.gd; do
            if ! grep -Fxq "$file" "$RUNNER_TEMP/blink-apk-entry-list.txt"; then
              echo "::error::Missing native BLINK LIFE asset: $file"
              exit 1
            fi
          done
          if ! grep -Eq '^lib/arm64-v8a/libgodot_android\\.so
      - name: Upload debug App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-aab-${{ github.sha }}
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 "$RUNNER_TEMP/blink-apk-entry-list.txt"; then
            echo "::error::The real Godot ARM64 native engine is missing from APK."
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'BlinkLifeGodotActivity'
          echo "BLINK LIFE native Godot Android binary, scene, and activity are bundled."

      - name: Build debug App Bundle
        run: gradle :app:bundleDebug --stacktrace --no-daemon

      - name: Upload debug App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-aab-${{ github.sha }}
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
