name: Android quality gate

# Keep this gate explicit for main-branch integration validation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Android-affecting changes
        id: scope
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci_change_scope.py >> "$GITHUB_OUTPUT"

      - name: Explain intentionally skipped Android work
        if: steps.scope.outputs.android != 'true'
        run: echo "No Android build inputs changed; the Android quality gate is not applicable."

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.android == 'true'

      - name: Unit tests
        if: steps.scope.outputs.android == 'true'
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Capture BLINK profile visual snapshots
        if: steps.scope.outputs.android == 'true'
        run: |
          gradle :app:testDebugUnitTest --tests com.example.ui.screens.BlinkProfileReferenceScreenshotTest -Proborazzi.test.record=true --no-daemon
          find . -name 'profile-reference-*.png' -print

      - name: Upload BLINK profile visual snapshots
        if: steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blink-profile-reference-screenshots-${{ github.sha }}
          path: '**/profile-reference-*.png'
          if-no-files-found: error
          retention-days: 7

      - name: Upload Connect visual reference captures
        if: always() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: connect-reference-captures-${{ github.sha }}
          path: app/src/test/screenshots/connect-reference-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Android lint
        if: steps.scope.outputs.android == 'true'
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --no-daemon
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== FULL LINT REPORT ====="
              cat "$report"
            fi
          fi
          exit "$status"

      - name: Compile instrumentation tests
        if: steps.scope.outputs.android == 'true'
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build debug APK
        if: steps.scope.outputs.android == 'true'
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify native BLINK LIFE is actually packaged
        if: steps.scope.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/blink-apk-entry-list.txt"
          for file in assets/project.godot assets/scenes/main.tscn assets/scripts/world.gd assets/scripts/neighborhood_layout.gd assets/scripts/neighborhood_details.gd assets/scripts/player_preferences.gd assets/scripts/day_cycle.gd; do
            if ! grep -Fxq "$file" "$RUNNER_TEMP/blink-apk-entry-list.txt"; then
              echo "::error::Missing native BLINK LIFE asset: $file"
              exit 1
            fi
          done
          if ! grep -Eq '^lib/arm64-v8a/libgodot_android\.so$' "$RUNNER_TEMP/blink-apk-entry-list.txt"; then
            echo "::error::The real Godot ARM64 native engine is missing from APK."
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'BlinkLifeGodotActivity'
          echo "BLINK LIFE native Godot Android binary, scene, and activity are bundled."

      - name: Build debug App Bundle
        if: steps.scope.outputs.android == 'true'
        run: gradle :app:bundleDebug --stacktrace --no-daemon

      - name: Upload debug App Bundle
        if: steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-aab-${{ github.sha }}
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest debug APK
        if: steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

