name: Android quality gate

# Testlab is the proving ground. main remains the production integration branch.
on:
  push:
    branches: [Testlab, main]
  pull_request:
    branches: [Testlab, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Isolate Testlab backend
        if: github.ref_name == 'Testlab' || github.base_ref == 'Testlab' || github.head_ref == 'Testlab'
        shell: bash
        run: |
          cat > .env <<'EOF'
          BLINK_ENV=staging
          SUPABASE_URL=https://testlab-not-configured.invalid
          SUPABASE_ANON_KEY=testlab_not_configured
          VITE_SUPABASE_URL=https://testlab-not-configured.invalid
          VITE_SUPABASE_ANON_KEY=testlab_not_configured
          EOF
          echo "BLINK_SHARE_BASE_URL=https://testlab-not-configured.invalid/functions/v1/blink-web" >> "$GITHUB_ENV"
          echo "Testlab backend isolation enabled; production Supabase fallback is forbidden."

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --no-daemon
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== FULL LINT REPORT ====="
              cat "$report"
            fi
          fi
          exit "$status"

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build debug APK for CI validation only
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prevent debug APK distribution as an app update
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "::notice::Debug APK validated successfully. It is intentionally NOT uploaded because it is debug-signed while using Blink's production package ID. Publishing it as a user update could cause Android signature/update mismatch errors. Production-installable APKs must come from the Signed Android release workflow."
