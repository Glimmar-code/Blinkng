name: Android quality gate

# Keep this gate explicit for main-branch integration validation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --no-daemon
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== FULL LINT REPORT ====="
              cat "$report"
            fi
          fi
          exit "$status"

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify real BLINK LIFE 3D is inside the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/blink-contents.txt"
          for game_file in \
            "assets/project.godot" \
            "assets/scenes/main.tscn" \
            "assets/scripts/world.gd"; do
            if ! grep -Fx "$game_file" "$RUNNER_TEMP/blink-contents.txt"; then
              echo "::error::BLINK LIFE 3D game asset missing: $game_file"
              exit 1
            fi
          done
          if ! grep -Eq '^lib/arm64-v8a/.*godot.*\.so

      - name: Upload debug App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-aab-${{ github.sha }}
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 "$RUNNER_TEMP/blink-contents.txt"; then
            echo "::error::Godot arm64 native engine library missing"
            exit 1
          fi
          echo "Native Godot engine and 3D game scene are packaged in this APK."

      - name: Build debug App Bundle
        run: gradle :app:bundleDebug --stacktrace --no-daemon

      - name: Upload debug App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-aab-${{ github.sha }}
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
