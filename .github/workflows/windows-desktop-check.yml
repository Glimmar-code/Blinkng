name: Windows desktop quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Android-Windows feature parity
        run: python3 scripts/check_windows_parity.py

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The repository currently contains Gradle wrapper properties but not the
      # wrapper launch scripts. Pin Gradle explicitly so the desktop build is
      # deterministic and does not depend on the runner's preinstalled version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Stage pinned Godot 4.3 native Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'blink-godot-4.3-windows.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'blink-godot-4.3-windows'
          $uri = 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extracted -Force
          $engine = Get-ChildItem -Path $extracted -Filter 'Godot_v4.3-stable_win64.exe' -Recurse | Select-Object -First 1
          if (-not $engine -or $engine.Length -lt 1000000) { throw 'Native Godot engine missing from archive' }
          $destination = 'desktopApp/build/nativeResources/windows/blink-life'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path $engine.FullName -Destination (Join-Path $destination 'BlinkLife.exe')
          Write-Host 'Staged native Godot Windows executable for desktop installer.'

      - name: Compile and test desktop app
        run: gradle -p desktopApp build --stacktrace --no-daemon

      - name: Build Windows EXE and MSI
        run: gradle -p desktopApp packageExe packageMsi --stacktrace --no-daemon

      - name: Verify Windows Godot scene and engine resources
        shell: pwsh
        run: |
          $base = 'desktopApp/build/nativeResources/windows/blink-life'
          foreach ($file in @('BlinkLife.exe', 'game/project.godot', 'game/scenes/main.tscn', 'game/scripts/world.gd', 'game/scripts/neighborhood_layout.gd', 'game/scripts/neighborhood_details.gd')) {
            if (-not (Test-Path (Join-Path $base $file))) {
              throw "Windows BLINK LIFE native asset missing: $file"
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-windows-${{ github.sha }}
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

