name: Windows desktop quality gate

on:
  pull_request:
  push:
    branches: [main, 'Testlab/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Windows build-affecting changes
        id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci_change_scope.py >> "$GITHUB_OUTPUT"

  parity:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail safely if diff classification failed
        if: always() && needs.scope.result != 'success'
        run: exit 1

      - name: Enforce Android-Windows feature parity
        if: needs.scope.result == 'success'
        run: python3 scripts/check_windows_parity.py

      - name: Guard shared Auth-inspired dark palette
        run: python3 scripts/check_premium_dark_tokens.py

      - name: Ensure Windows startup failures have retry and sign-out recovery
        run: node scripts/test_desktop_startup_recovery.mjs

  windows-build:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Windows Git refs are case-insensitive; fetching every remote branch
      # fails when this repository has both Testlab and testlab refs.
      # Fetch only this PR / commit history, never refs/heads/*.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Compute actual checked-out Windows packaging input digest
        id: input_digest
        shell: pwsh
        env:
          BLINK_CI_SCOPE: windows
        run: python scripts/ci_verified_reuse.py --fingerprint

      - name: BLINK verified windows input sha256 ${{ steps.input_digest.outputs.fingerprint }}
        shell: pwsh
        run: Write-Output 'Stamped exact Windows build/test/packaging inputs for this verified job.'

      - name: Check whether full Windows packaging inputs were previously verified
        id: reuse
        shell: pwsh
        env:
          BLINK_CI_SCOPE: windows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_verified_reuse.py

      - name: Explain evidence-backed Windows build reuse
        if: steps.reuse.outputs.reuse == 'true'
        shell: pwsh
        run: Write-Output 'Prior successful Windows build, EXE and MSI packaging reused from identical source, test and dependency inputs; this commit has a fresh successful check.'

      - uses: actions/setup-java@v5
        if: steps.reuse.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: '17'

      # The repository currently contains Gradle wrapper properties but not the
      # wrapper launch scripts. Pin Gradle explicitly so the desktop build is
      # deterministic and does not depend on the runner's preinstalled version.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.reuse.outputs.reuse != 'true'
        with:
          gradle-version: '8.12.1'

      - name: Stage pinned Godot 4.3 native Windows runtime
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'blink-godot-4.3-windows.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'blink-godot-4.3-windows'
          $uri = 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extracted -Force
          $engine = Get-ChildItem -Path $extracted -Filter 'Godot_v4.3-stable_win64.exe' -Recurse | Select-Object -First 1
          if (-not $engine -or $engine.Length -lt 1000000) { throw 'Native Godot engine missing' }
          $destination = 'desktopApp/build/nativeResources/windows/blink-life'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path $engine.FullName -Destination (Join-Path $destination 'BlinkLife.exe')

      - name: Compile and test desktop app
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          gradle -p desktopApp build --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/blink-desktop-build.log"
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            # Keep the actual failure available through check annotations even
            # when a reviewer's environment cannot download Actions artifacts.
            Get-ChildItem 'desktopApp/build/test-results' -Recurse -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
              [xml]$results = Get-Content $_.FullName -Raw
              foreach ($case in $results.testsuite.testcase) {
                foreach ($failure in @($case.failure) + @($case.error)) {
                  if ($null -ne $failure) {
                    $message = "$($case.classname).$($case.name): $($failure.message) $($failure.InnerText)"
                    $message = $message.Substring(0, [Math]::Min(6000, $message.Length)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                    Write-Output "::error title=Desktop test failure::$message"
                  }
                }
              }
            }
            $tail = ((Get-Content "$env:RUNNER_TEMP/blink-desktop-build.log" -Tail 70) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Desktop build log tail::$tail"
            exit $buildExit
          }

      - name: Build Windows EXE and MSI
        if: steps.reuse.outputs.reuse != 'true'
        # Installer tasks do not guarantee a standalone launcher image remains.
        # Build that image explicitly for the packaged-runtime diagnostic below.
        run: gradle -p desktopApp createDistributable packageExe packageMsi --stacktrace --no-daemon

      - name: Exercise the packaged Windows video processor
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $app = Get-ChildItem 'desktopApp/build/compose/binaries/main/app' -Recurse -Filter 'Blinkng.exe' | Select-Object -First 1
            if (-not $app) { throw 'Packaged Blinkng launcher is missing' }
            $diagnostic = Join-Path $env:RUNNER_TEMP 'blink-media-smoke'
            New-Item -ItemType Directory -Force -Path $diagnostic | Out-Null
            $task = Start-Process -FilePath $app.FullName -RedirectStandardOutput (Join-Path $diagnostic 'launcher-stdout.log') -RedirectStandardError (Join-Path $diagnostic 'launcher-stderr.log') -ArgumentList @('--media-export-smoke', ('"' + $diagnostic + '"')) -PassThru
            if (-not $task.WaitForExit(120000)) { $task.Kill(); throw 'Packaged media diagnostic timed out' }
            $reportPath = Join-Path $diagnostic 'media-smoke.json'
            if (Test-Path $reportPath) { Get-Content $reportPath -Raw | Write-Host }
            if ($task.ExitCode -ne 0) { throw "Packaged media diagnostic failed with exit $($task.ExitCode)" }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.status -ne 'passed') { throw 'Packaged media diagnostic did not pass' }
            if ($report.windows_dpapi -ne 'passed') { throw 'Packaged Windows DPAPI draft verification did not pass' }
            $report | ConvertTo-Json
          } catch {
            $detail = $_.Exception.Message
            foreach ($name in @('media-smoke.json', 'launcher-stdout.log', 'launcher-stderr.log', 'fixture.log')) {
              $path = Join-Path $env:RUNNER_TEMP ('blink-media-smoke/' + $name)
              if (Test-Path $path) { $detail += "`n${name}: " + ((Get-Content $path -Tail 40) -join "`n") }
            }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaged native media failure::$detail"
            throw
          }

      - name: Capture actual packaged Windows editor windows
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-ChildItem 'desktopApp/build/compose/binaries/main/app' -Recurse -Filter 'Blinkng.exe' | Select-Object -First 1
          if (-not $app) { throw 'Packaged Blinkng launcher is missing' }
          $capture = Join-Path $env:RUNNER_TEMP 'blink-reference-ui'
          $task = Start-Process -FilePath $app.FullName -RedirectStandardOutput "$env:RUNNER_TEMP/blink-reference-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/blink-reference-stderr.log" -ArgumentList @('--reference-ui-smoke', ('"' + $capture + '"')) -PassThru
          if (-not $task.WaitForExit(120000)) { $task.Kill(); throw 'Windows GUI capture timed out' }
          $reportPath = Join-Path $capture 'reference-ui.json'
          if (Test-Path $reportPath) { Get-Content $reportPath -Raw | Write-Host }
          if ($task.ExitCode -ne 0) {
            $detail = "Native GUI capture failed with exit $($task.ExitCode)"
            foreach ($path in @($reportPath, "$env:RUNNER_TEMP/blink-reference-stderr.log")) {
              if (Test-Path $path) { $detail += "`n" + ((Get-Content $path -Tail 30) -join "`n") }
            }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows GUI capture failure::$detail"
            throw 'Actual Windows editor capture did not complete'
          }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne 'captured-awaiting-review') { throw 'Missing native GUI evidence' }
          foreach ($name in @('photo-editor.png', 'video-editor-top.png', 'video-editor-bottom.png')) {
            if ((Get-Item (Join-Path $capture $name)).Length -lt 1000) { throw "Missing Windows capture: $name" }
          }

      - name: Upload Windows visual evidence
        if: always() && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-reference-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blink-reference-ui/*.png
            ${{ runner.temp }}/blink-reference-ui/reference-ui.json
            ${{ runner.temp }}/blink-reference-stdout.log
            ${{ runner.temp }}/blink-reference-stderr.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native Godot assets in Windows installer build
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $base = 'desktopApp/build/nativeResources/windows/blink-life'
          foreach ($file in @('BlinkLife.exe', 'game/project.godot', 'game/scenes/main.tscn', 'game/scripts/world.gd')) {
            if (-not (Test-Path (Join-Path $base $file))) {
              throw "BLINK LIFE Windows asset missing: $file"
            }
          }

      - name: Upload Windows installers
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkng-windows-${{ github.sha }}
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
