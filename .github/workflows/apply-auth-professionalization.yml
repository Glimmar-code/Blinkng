name: Apply auth professionalization

on:
  push:
    paths:
      - '.github/workflows/apply-auth-professionalization.yml'
      - '.github/scripts/run_auth_professionalization_v2.py'

permissions:
  contents: write

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply auth professionalization patch
        run: python .github/scripts/run_auth_professionalization_v2.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Commit verified auth changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test/java
          if git diff --cached --quiet; then
            echo "No auth source changes to commit"
            exit 0
          fi
          git commit -m "fix: professionalize auth routing and recovery"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
