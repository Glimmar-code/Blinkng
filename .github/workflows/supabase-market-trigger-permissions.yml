name: Supabase market trigger RPC boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261028091500_restrict_market_trigger_api_execution.sql'
      - 'supabase/tests/market_trigger_privileges_*'
      - '.github/workflows/supabase-market-trigger-permissions.yml'
  push:
    branches: [main, 'Testlab-*']
    paths:
      - 'supabase/migrations/20261028091500_restrict_market_trigger_api_execution.sql'
      - 'supabase/tests/market_trigger_privileges_*'
      - '.github/workflows/supabase-market-trigger-permissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-trigger-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary_ci_only
          POSTGRES_DB: blink_trigger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blink_trigger_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: temporary_ci_only
      PGDATABASE: blink_trigger_ci
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is installed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create isolated fake seller-trigger fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/market_trigger_privileges_fixture.pgfixture
      - name: Apply proposed migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028091500_restrict_market_trigger_api_execution.sql
      - name: Prove public RPC denial and preserved trigger execution
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/market_trigger_privileges_assertions.sql
      - name: Confirm production database was not accessed
        run: echo 'Disposable PostgreSQL only. No BLINK cloud secrets, deployments or production changes.'
