name: Android release smoke test

on:
  push:
    branches:
      - main
      - Testlab
      - 'Testlab-*'
    paths:
      - 'app/src/**'
      - 'shared/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'app/google-services.json.example'
      - '.github/scripts/restore_google_services.sh'
      - 'app/proguard-rules.pro'
      - '.github/workflows/signed-release.yml'
      - '.github/workflows/release-smoke-test.yml'
  pull_request:
    branches:
      - main
      - Testlab
    paths:
      - 'app/src/**'
      - 'shared/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'app/google-services.json.example'
      - '.github/scripts/restore_google_services.sh'
      - 'app/proguard-rules.pro'
      - '.github/workflows/signed-release.yml'
      - '.github/workflows/release-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify launcher images match the approved BLINK logo
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/sync_android_launcher_assets.py --check

      - name: Test secure Firebase release config restoration
        shell: bash
        run: bash .github/scripts/test_restore_google_services.sh

      - name: Restore disposable Firebase client configuration
        shell: bash
        run: bash .github/scripts/restore_google_services.sh ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android/Firebase package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = "com.aistudio.blink.appvtwo"
          gradle = Path("app/build.gradle.kts").read_text()
          if f'applicationId = "{expected}"' not in gradle:
              raise SystemExit(f"Android applicationId must remain {expected}")

          data = json.loads(Path("app/google-services.json").read_text())
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in data.get("client", [])
          }
          if expected not in packages:
              raise SystemExit(f"Firebase config has no Android client for {expected}")
          print(f"Android/Firebase package identity verified: {expected}")
          PY

      - name: Create disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release-smoke.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass smoke-password \
            -keypass smoke-password \
            -alias smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Blink Release Smoke,OU=CI,O=Blink,L=Akure,ST=Ondo,C=NG"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release variant with disposable key
        env:
          STORE_PASSWORD: smoke-password
          KEY_ALIAS: smoke
          KEY_PASSWORD: smoke-password
          VERSION_CODE: '1999000000'
          VERSION_NAME: 'ci-smoke'
          ALLOW_PLACEHOLDER_GOOGLE_SERVICES: 'true'
        run: gradle :app:assembleRelease :app:bundleRelease -x :app:uploadCrashlyticsMappingFileRelease --stacktrace --no-daemon

      - name: Verify embedded source revision
        shell: bash
        run: |
          set -euo pipefail
          BUILD_CONFIG="$(find app/build/generated -path '*/release/*/BuildConfig.java' -type f | head -n 1)"
          test -n "$BUILD_CONFIG"
          grep -F "BUILD_COMMIT_SHA = \"$GITHUB_SHA\"" "$BUILD_CONFIG" >/dev/null
          echo "Release smoke build embeds source revision: $GITHUB_SHA"

      - name: Verify generated release identity and signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$APK"
          test -n "$AAB"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB" >/dev/null

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='com.aistudio.blink.appvtwo'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='1999000000'" >/dev/null
          echo "$BADGING" | grep -F "versionName='ci-smoke'" >/dev/null

          echo "Release smoke APK/AAB package, version and signatures verified."

      # Verify the actual release APK can be installed by Android 15's package manager,
      # not merely read by aapt or apksigner. CI's disposable key is never published.
      - name: Enable KVM for Android 15 release installation test
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install release smoke APK on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            # android-emulator-runner executes this script with /bin/sh (dash) by default.
            # pipefail is a Bash-only option and prevented the APK install from running.
            set -eu
            APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
            test -s "$APK"
            adb install -r "$APK"
            adb shell pm path com.aistudio.blink.appvtwo | grep -F 'package:'
            adb shell dumpsys package com.aistudio.blink.appvtwo | grep -F 'versionCode=1999000000'
            echo "Android 15 package manager installed signed release smoke APK successfully."

