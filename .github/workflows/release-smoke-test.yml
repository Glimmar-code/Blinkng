name: Android release smoke test

on:
  push:
    branches: [Testlab, main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'shared/src/main/kotlin/com/blinkng/shared/BlinkBackendDefaults.kt'
      - 'app/src/main/java/com/example/data/supabase/SupabaseConfig.kt'
      - '.github/workflows/signed-release.yml'
      - '.github/workflows/release-smoke-test.yml'
  pull_request:
    branches: [Testlab, main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'shared/src/main/kotlin/com/blinkng/shared/BlinkBackendDefaults.kt'
      - 'app/src/main/java/com/example/data/supabase/SupabaseConfig.kt'
      - '.github/workflows/signed-release.yml'
      - '.github/workflows/release-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Isolate non-production backend
        if: github.ref_name == 'Testlab' || github.event_name == 'pull_request'
        shell: bash
        run: |
          cat > .env <<'EOF'
          BLINK_ENV=staging
          SUPABASE_URL=https://testlab-not-configured.invalid
          SUPABASE_ANON_KEY=testlab_not_configured
          VITE_SUPABASE_URL=https://testlab-not-configured.invalid
          VITE_SUPABASE_ANON_KEY=testlab_not_configured
          EOF
          echo "BLINK_SHARE_BASE_URL=https://testlab-not-configured.invalid/functions/v1/blink-web" >> "$GITHUB_ENV"
          echo "Release smoke test is isolated from production Supabase."

      - name: Create disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release-smoke.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass smoke-password \
            -keypass smoke-password \
            -alias smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Blink Release Smoke,OU=CI,O=Blink,L=Akure,ST=Ondo,C=NG"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release variant with disposable key
        env:
          STORE_PASSWORD: smoke-password
          KEY_ALIAS: smoke
          KEY_PASSWORD: smoke-password
          VERSION_CODE: '1999000000'
          VERSION_NAME: 'ci-smoke'
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify generated APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
