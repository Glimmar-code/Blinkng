name: BLINK production release failure watch

# Inspect completed official production release pipelines. This workflow reads
# the trusted monitor from main, never checks out untrusted build artifacts.
on:
  workflow_run:
    workflows:
      - Signed Android release
      - Publish latest APK
      - Verify published BLINK APK
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: blink-production-release-health
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'Glimmar-code/Blinkng' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted production failure handling code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate production alert safety rules
        run: node --test .github/scripts/test_release_failure_watch.cjs

      - name: Open or update a release incident without altering production
        uses: actions/github-script@v7
        with:
          script: |
            const watch = require('./.github/scripts/release_failure_watch.cjs');
            await watch({github, context, core});
