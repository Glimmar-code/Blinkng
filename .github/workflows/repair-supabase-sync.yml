name: Repair Supabase synchronization

on:
  push:
    branches: [fix/supabase-sync]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch Android/Supabase integration
        shell: bash
        run: |
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_function(text: str, name: str, new_code: str) -> str:
              m = re.search(r'(?m)^(?P<indent>[ \\t]*)(?:(?:public|private|internal|protected)\\s+)?(?:suspend\\s+)?fun\\s+' + re.escape(name) + r'\\b', text)
              if not m:
                  raise SystemExit(f'Missing function: {name}')
              start = m.start()
              brace = text.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'Missing function body: {name}')
              depth = 0
              i = brace
              while i < len(text):
                  c = text[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          return text[:start] + new_code.rstrip() + text[end:]
                  i += 1
              raise SystemExit(f'Unbalanced body: {name}')

          def patch(path, fn):
              p = ROOT / path
              s = p.read_text()
              s2 = fn(s)
              if s2 == s:
                  raise SystemExit(f'No changes made to {path}')
              p.write_text(s2)

          # -------------------------
          # SupabaseService.kt
          # -------------------------
          service = 'app/src/main/java/com/example/data/supabase/SupabaseService.kt'
          def patch_service(s: str) -> str:
              # Fail closed: never use the anon key as an authenticated user's JWT.
              old = '''            accessToken()\n                    ?.takeIf { it.isNotBlank() }\n                    ?: anonKey'''
              new = '''            accessToken()\n                    ?.takeIf { it.isNotBlank() }\n                    ?: throw IllegalStateException("Authenticated Supabase request requires a valid user session.")'''
              if old in s:
                  s = s.replace(old, new, 1)

              # Correct username -> email sign-in lookup; never invent an institutional email.
              s = s.replace('''                        "$cleanInput@student.university.edu.ng"''', '''                        run {\n                            val lookup = fetchProfileByUsername(cleanInput)\n                                ?: return@run ""\n                            lookup.email.value.trim().lowercase(Locale.US)\n                        }''', 1)
              s = s.replace('''                val body =\n                    JSONObject().apply {\n                        put(\n                            "email",\n                            loginEmail\n                        )''', '''                if (loginEmail.isBlank()) {\n                    return@withContext Result.failure(Exception("Username was not found. Sign in with your real account email."))\n                }\n\n                val body =\n                    JSONObject().apply {\n                        put(\n                            "email",\n                            loginEmail\n                        )''', 1)

              # Remove fabricated signup profile IDs.
              s = s.replace('''                    val profile = ensureAuthenticatedProfile(\n                        userId = userId.ifBlank { "user_${System.currentTimeMillis()}" },''', '''                    if (userId.isBlank() || !isValidUuid(userId) || accessToken.isBlank()) {\n                        return@withContext Result.failure(Exception("Supabase signup did not return a usable authenticated session."))\n                    }\n\n                    val profile = ensureAuthenticatedProfile(\n                        userId = userId,''', 1)

              s = replace_function(s, 'isAuthenticated', '''    fun isAuthenticated(): Boolean {\n        val token = accessToken() ?: return false\n        val subject = decodeJwtSubject(token) ?: return false\n        val expiry = jwtExpirationMillis(token)\n        return isValidUuid(subject) && (expiry == null || expiry > System.currentTimeMillis())\n    }''')

              s = replace_function(s, 'ensureAuthenticatedProfile', '''    suspend fun ensureAuthenticatedProfile(\n        userId: String,\n        email: String,\n        username: String,\n        fullName: String,\n        faculty: String? = null,\n        university: String? = null\n    ): UserProfile = withContext(Dispatchers.IO) {\n        val authUserId = userId.takeIf { isValidUuid(it) } ?: getCurrentUserId()\n        ?: throw IllegalStateException("No authenticated Supabase user ID is available.")\n        val cleanUsername = username.trim().lowercase(Locale.US).replace(Regex("[^a-z0-9._-]"), "_")\n        val cleanFullName = fullName.trim().ifBlank { cleanUsername }\n        if (cleanUsername.isBlank()) throw IllegalArgumentException("Username is required.")\n\n        fetchProfileById(authUserId)?.let { return@withContext it }\n\n        val json = JSONObject().apply {\n            put("id", authUserId)\n            put("email", email.trim().lowercase(Locale.US))\n            put("username", cleanUsername)\n            put("full_name", cleanFullName)\n            faculty?.trim()?.takeIf { it.isNotBlank() }?.let { put("faculty", it) }\n            university?.trim()?.takeIf { it.isNotBlank() }?.let { put("university", it) }\n            put("updated_at", nowIso())\n        }\n        val req = newRequestBuilder("/rest/v1/profiles", authenticated = true)\n            .addHeader("Prefer", "resolution=merge-duplicates,return=representation")\n            .post(json.toString().toRequestBody(jsonMediaType)).build()\n        executeRequest(req).use { resp ->\n            val body = resp.body?.string().orEmpty()\n            if (!resp.isSuccessful || body.isBlank() || body == "[]") {\n                Log.e(TAG, "PROFILE_CREATE failed status=${resp.code} body=$body")\n                throw IllegalStateException(parseSupabaseError(body, "Unable to create profile."))\n            }\n        }\n        fetchProfileById(authUserId)\n            ?: throw IllegalStateException("Profile was created but could not be read back from Supabase.")\n    }''')

              s = replace_function(s, 'updateProfile', '''    suspend fun updateProfile(profile: UserProfile): Boolean = withContext(Dispatchers.IO) {\n        try {\n            val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n            val year = profile.graduationYear.trim().toIntOrNull()\n            val json = JSONObject().apply {\n                put("full_name", profile.fullName.trim())\n                put("username", profile.username.trim().lowercase(Locale.US))\n                put("avatar_url", profile.avatarUrl)\n                put("cover_photo_url", profile.coverPhotoUrl)\n                put("professional_headline", profile.professionalHeadline)\n                put("current_job_title", profile.currentJobTitle)\n                put("bio", profile.bio)\n                put("university", profile.university)\n                put("faculty", profile.faculty)\n                put("department", profile.department)\n                put("course_of_study", profile.courseOfStudy)\n                put("academic_level", profile.academicLevel)\n                if (year != null) put("graduation_year", year) else put("graduation_year", JSONObject.NULL)\n                put("country_of_origin", profile.countryOfOrigin)\n                put("current_city_state", profile.currentCityState)\n                put("email", profile.email.value)\n                put("phone", profile.phone.value)\n                put("whatsapp", profile.whatsapp.value)\n                put("website", profile.links.website)\n                put("linkedin", profile.links.linkedin)\n                put("twitter", profile.links.twitter)\n                put("instagram", profile.links.instagram)\n                put("featured_link", profile.links.featuredLink)\n                put("featured_link_label", profile.links.featuredLinkLabel)\n                put("favorite_quote", profile.favoriteQuote)\n                put("availability", profile.availability.label)\n                put("core_skills", JSONArray(profile.coreSkills))\n                put("hobbies", JSONArray(profile.hobbies))\n                put("languages", JSONArray(profile.languages))\n                put("updated_at", nowIso())\n            }\n            val req = newRequestBuilder("/rest/v1/profiles?id=eq.${encodeValue(uid)}", authenticated = true)\n                .addHeader("Prefer", "return=representation")\n                .patch(json.toString().toRequestBody(jsonMediaType)).build()\n            executeRequest(req).use { resp ->\n                val body = resp.body?.string().orEmpty()\n                if (!resp.isSuccessful || body == "[]" || body.isBlank()) {\n                    Log.e(TAG, "PROFILE_UPDATE failed status=${resp.code} body=$body")\n                    return@withContext false\n                }\n                true\n            }\n        } catch (e: Exception) {\n            Log.e(TAG, "PROFILE_UPDATE exception", e)\n            false\n        }\n    }''')

              s = replace_function(s, 'createFeedPost', '''    suspend fun createFeedPost(\n        author: String,\n        authorAvatar: String,\n        facultyTag: String,\n        text: String,\n        imageUrl: String?,\n        videoUrl: String? = null,\n        tags: List<String> = emptyList(),\n        mentions: List<String> = emptyList(),\n        poll: PostPoll? = null,\n        isReel: Boolean = false,\n        audience: String = "Everyone",\n        category: String = "Campus Life",\n        location: String? = null,\n        linkUrl: String? = null,\n        allowComments: Boolean = true,\n        hideLikes: Boolean = false,\n        isPinned: Boolean = false,\n        isDisappearing: Boolean = false,\n        audioTitle: String? = null,\n        altText: String? = null\n    ): FeedPost? = withContext(Dispatchers.IO) {\n        try {\n            val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n            val mentionIds = JSONArray()\n            for (mention in mentions) {\n                val id = if (isValidUuid(mention)) mention else fetchProfileByUsername(mention.removePrefix("@"))?.id\n                if (!id.isNullOrBlank() && isValidUuid(id)) mentionIds.put(id)\n            }\n            val json = JSONObject().apply {\n                put("user_id", uid)\n                put("type", when { isReel || !videoUrl.isNullOrBlank() -> "reel"; !imageUrl.isNullOrBlank() -> "photo"; else -> "text" })\n                put("faculty", facultyTag.trim())\n                put("text", text.trim())\n                if (!imageUrl.isNullOrBlank()) { put("image_url", imageUrl); put("images", JSONArray().put(imageUrl)) }\n                if (!videoUrl.isNullOrBlank()) put("video_url", videoUrl)\n                put("tags", JSONArray(tags.filter { it.isNotBlank() }))\n                put("mentions", mentionIds)\n                put("is_reel", isReel)\n                put("audience", audience)\n                put("category", category)\n                location?.takeIf { it.isNotBlank() }?.let { put("location", it) }\n                linkUrl?.takeIf { it.isNotBlank() }?.let { put("link_url", it) }\n                put("allow_comments", allowComments)\n                put("hide_likes", hideLikes)\n                put("is_pinned", isPinned)\n                put("is_disappearing", isDisappearing)\n                audioTitle?.takeIf { it.isNotBlank() }?.let { put("audio_title", it) }\n                altText?.takeIf { it.isNotBlank() }?.let { put("alt_text", it) }\n            }\n            val req = newRequestBuilder("/rest/v1/feed_posts", authenticated = true)\n                .addHeader("Prefer", "return=representation")\n                .post(json.toString().toRequestBody(jsonMediaType)).build()\n            val created = executeRequest(req).use { resp ->\n                val body = resp.body?.string().orEmpty()\n                if (!resp.isSuccessful || body.isBlank() || body == "[]") {\n                    Log.e(TAG, "POST_CREATE failed status=${resp.code} body=$body")\n                    throw IllegalStateException(parseSupabaseError(body, "Could not create post."))\n                }\n                JSONArray(body).optJSONObject(0) ?: JSONObject(body)\n            }\n            val postId = created.optString("id").takeIf { isValidUuid(it) }\n                ?: throw IllegalStateException("Supabase created a post without a valid ID.")\n\n            if (poll != null) {\n                val pollJson = JSONObject().apply {\n                    put("post_id", postId)\n                    put("question", poll.question)\n                    put("allows_multiple", false)\n                }\n                val pollResp = executeRequest(newRequestBuilder("/rest/v1/polls", true)\n                    .addHeader("Prefer", "return=representation")\n                    .post(pollJson.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n                    val body = resp.body?.string().orEmpty()\n                    if (!resp.isSuccessful || body == "[]" || body.isBlank()) throw IllegalStateException(parseSupabaseError(body, "Could not create poll."))\n                    JSONArray(body).getJSONObject(0)\n                }\n                val pollId = pollResp.optString("id")\n                for ((idx, option) in poll.options.withIndex()) {\n                    val optionJson = JSONObject().apply { put("poll_id", pollId); put("option_text", option.text); put("position", idx) }\n                    executeRequest(newRequestBuilder("/rest/v1/poll_options", true)\n                        .addHeader("Prefer", "return=representation")\n                        .post(optionJson.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n                        val body = resp.body?.string().orEmpty()\n                        if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Could not create poll option."))\n                    }\n                }\n                val patch = JSONObject().put("poll_id", pollId)\n                executeRequest(newRequestBuilder("/rest/v1/feed_posts?id=eq.$postId", true)\n                    .patch(patch.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n                    if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(resp.body?.string().orEmpty(), "Could not attach poll."))\n                }\n            }\n            fetchFeedPosts().firstOrNull { it.id == postId }\n                ?: parseFeedPost(created)\n        } catch (e: Exception) {\n            Log.e(TAG, "POST_CREATE exception", e)\n            null\n        }\n    }''')

              # Make feed/bookmark/like state user-UUID based and fail loudly on backend failure.
              s = replace_function(s, 'fetchFeedPosts', '''    suspend fun fetchFeedPosts(): List<FeedPost> = withContext(Dispatchers.IO) {\n        val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n        val req = newRequestBuilder("/rest/v1/feed_posts?select=*&order=created_at.desc&limit=100", true).get().build()\n        val postArray = executeRequest(req).use { resp ->\n            val body = resp.body?.string().orEmpty()\n            if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code}: ${parseSupabaseError(body, "Feed fetch failed.")}")\n            JSONArray(body)\n        }\n        val userIds = (0 until postArray.length()).mapNotNull { postArray.optJSONObject(it)?.optString("user_id")?.takeIf { id -> isValidUuid(id) } }.distinct()\n        val profileMap = mutableMapOf<String, JSONObject>()\n        if (userIds.isNotEmpty()) {\n            val pReq = newRequestBuilder("/rest/v1/profiles?id=in.(${userIds.joinToString(",")})&select=id,username,full_name,avatar_url,verification_badge,is_verified", true).get().build()\n            executeRequest(pReq).use { resp ->\n                val body = resp.body?.string().orEmpty()\n                if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code}: ${parseSupabaseError(body, "Profile fetch failed.")}")\n                val arr = JSONArray(body)\n                for (i in 0 until arr.length()) { val p = arr.getJSONObject(i); profileMap[p.optString("id")] = p }\n            }\n        }\n        val likesReq = newRequestBuilder("/rest/v1/post_likes?select=post_id&user_id=eq.${encodeValue(uid)}", true).get().build()\n        val myLikes = executeRequest(likesReq).use { resp ->\n            val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code}: ${parseSupabaseError(body, "Like state fetch failed.")}")\n            val arr = JSONArray(body); buildSet { for (i in 0 until arr.length()) add(arr.getJSONObject(i).optString("post_id")) }\n        }\n        val bmReq = newRequestBuilder("/rest/v1/post_bookmarks?select=post_id&user_id=eq.${encodeValue(uid)}", true).get().build()\n        val myBookmarks = executeRequest(bmReq).use { resp ->\n            val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code}: ${parseSupabaseError(body, "Bookmark state fetch failed.")}")\n            val arr = JSONArray(body); buildSet { for (i in 0 until arr.length()) add(arr.getJSONObject(i).optString("post_id")) }\n        }\n        buildList {\n            for (i in 0 until postArray.length()) {\n                val obj = postArray.getJSONObject(i)\n                val p = profileMap[obj.optString("user_id")]\n                val mapped = JSONObject(obj.toString()).apply {\n                    p?.let { put("author", it.optString("username")); put("author_avatar", it.optString("avatar_url")); put("is_verified", it.optBoolean("is_verified")); put("verification_badge", it.optString("verification_badge")); put("username", it.optString("username")) }\n                }\n                var post = parseFeedPost(mapped).copy(isLiked = myLikes.contains(mapped.optString("id")), isBookmarked = myBookmarks.contains(mapped.optString("id")))\n                add(post)\n            }\n        }\n    }''')

              s = replace_function(s, 'togglePostBookmark', '''    suspend fun togglePostBookmark(postId: String, bookmarked: Boolean): Boolean = withContext(Dispatchers.IO) {\n        val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n        val url = if (bookmarked) "/rest/v1/post_bookmarks" else "/rest/v1/post_bookmarks?post_id=eq.${encodeValue(postId)}&user_id=eq.${encodeValue(uid)}"\n        val req = newRequestBuilder(url, true).apply {\n            if (bookmarked) {\n                post(JSONObject().apply { put("post_id", postId); put("user_id", uid) }.toString().toRequestBody(jsonMediaType))\n                addHeader("Prefer", "resolution=merge-duplicates,return=minimal")\n            } else delete()\n        }.build()\n        executeRequest(req).use { resp ->\n            val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Bookmark update failed.")); true\n        }\n    }''')

              s = replace_function(s, 'togglePostLike', '''    suspend fun togglePostLike(postId: String, liked: Boolean, newLikeCount: Int): Boolean = withContext(Dispatchers.IO) {\n        val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n        val req = if (liked) {\n            newRequestBuilder("/rest/v1/post_likes", true).addHeader("Prefer", "resolution=merge-duplicates,return=minimal")\n                .post(JSONObject().apply { put("post_id", postId); put("user_id", uid) }.toString().toRequestBody(jsonMediaType)).build()\n        } else {\n            newRequestBuilder("/rest/v1/post_likes?post_id=eq.${encodeValue(postId)}&user_id=eq.${encodeValue(uid)}", true).delete().build()\n        }\n        executeRequest(req).use { resp ->\n            val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Like update failed."))\n        }\n        val countReq = newRequestBuilder("/rest/v1/feed_posts?id=eq.${encodeValue(postId)}&select=id,like_count", true).get().build()\n        executeRequest(countReq).use { resp ->\n            val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Like count refresh failed.")); true\n        }\n    }''')

              s = replace_function(s, 'deleteFeedPost', '''    suspend fun deleteFeedPost(postId: String): Boolean = withContext(Dispatchers.IO) {\n        val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n        val req = newRequestBuilder("/rest/v1/feed_posts?id=eq.${encodeValue(postId)}&user_id=eq.${encodeValue(uid)}", true).delete().build()\n        executeRequest(req).use { resp ->\n            val body = resp.body?.string().orEmpty()\n            if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Post deletion failed."))\n            true\n        }\n    }''')

              # Media URL must match an actually public bucket.
              s = s.replace('"/storage/v1/object/feed-media/$path"', '"/storage/v1/object/post-media/$path"')
              s = s.replace('"$baseUrl/storage/v1/object/public/feed-media/$path"', '"$baseUrl/storage/v1/object/public/post-media/$path"')

              # Remove invalid legacy username columns from relation writes/queries.
              s = re.sub(r'\\s*put\\("username", currentUsername\\)', '', s)
              s = re.sub(r'&username=eq\.\\$\\{URLEncoder\.encode\(username, "UTF-8"\)\\}', '', s)
              s = s.replace('"/rest/v1/story_views?viewer_username=', '"/rest/v1/story_views?user_id=eq.${getCurrentUserId()}&viewer_username=')
              s = s.replace('"/rest/v1/story_likes?username=eq.${URLEncoder.encode(username, "UTF-8")}&select=story_id"', '"/rest/v1/story_likes?user_id=eq.${getCurrentUserId()}&select=story_id"')

              # Actual activity columns; notifications use recipient user id, not usernames.
              s = replace_function(s, 'fetchActivities', '''    suspend fun fetchActivities(): Result<List<ActivityItem>> = withContext(Dispatchers.IO) {\n        try {\n            val uid = getCurrentUserId() ?: return@withContext Result.failure(Exception("User not logged in."))\n            val req = newRequestBuilder("/rest/v1/activities?recipient_id=eq.${encodeValue(uid)}&order=created_at.desc&limit=100", true).get().build()\n            executeRequest(req).use { resp ->\n                val body = resp.body?.string().orEmpty()\n                if (!resp.isSuccessful) return@withContext Result.failure(Exception(parseSupabaseError(body, "Activity fetch failed.")))\n                val arr = JSONArray(body)\n                val items = buildList {\n                    for (i in 0 until arr.length()) {\n                        val o = arr.getJSONObject(i)\n                        add(ActivityItem(\n                            id = o.optString("id"),\n                            user = o.optString("actor_id"),\n                            avatar = "",\n                            action = o.optString("message", o.optString("activity_type")),\n                            time = formatTimeAgo(o.optString("created_at")),\n                            rawTimestamp = o.optString("created_at"),\n                            isUnread = !o.optBoolean("is_read", false),\n                            targetPostId = o.optString("entity_id").takeIf { o.optString("entity_type").equals("post", true) },\n                            targetType = o.optString("entity_type").ifBlank { null }\n                        ))\n                    }\n                }\n                Result.success(items)\n            }\n        } catch (e: Exception) {\n            Log.e(TAG, "fetchActivities exception", e); Result.failure(e)\n        }\n    }''')

              s = replace_function(s, 'recordActivity', '''    suspend fun recordActivity(\n        recipientUsername: String,\n        action: String,\n        category: NotificationFilter = NotificationFilter.ALL,\n        targetPostId: String? = null,\n        targetMarketId: String? = null,\n        targetUsername: String? = null,\n        targetType: String? = null,\n        previewText: String? = null\n    ): Boolean = withContext(Dispatchers.IO) {\n        try {\n            val actorId = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n            val recipient = fetchProfileByUsername(recipientUsername.removePrefix("@")) ?: return@withContext false\n            if (recipient.id == actorId) return@withContext false\n            val entityId = targetPostId ?: targetMarketId\n            val entityType = targetType ?: when { targetPostId != null -> "post"; targetMarketId != null -> "market"; else -> null }\n            val json = JSONObject().apply {\n                put("recipient_id", recipient.id); put("actor_id", actorId); put("activity_type", category.name); put("message", action); entityType?.let { put("entity_type", it) }; entityId?.let { put("entity_id", it) }; put("is_read", false)\n            }\n            executeRequest(newRequestBuilder("/rest/v1/activities", true).post(json.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n                val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Activity creation failed.")); true\n            }\n        } catch (e: Exception) { Log.e(TAG, "recordActivity failed", e); false }\n    }''')

              s = replace_function(s, 'markAllActivitiesRead', '''    suspend fun markAllActivitiesRead(): Boolean = withContext(Dispatchers.IO) {\n        val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n        val body = JSONObject().put("is_read", true)\n        executeRequest(newRequestBuilder("/rest/v1/activities?recipient_id=eq.${encodeValue(uid)}&is_read=eq.false", true).patch(body.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n            val text = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(text, "Could not mark activities read.")); true\n        }\n    }''')

              s = replace_function(s, 'submitVerificationRequest', '''    suspend fun submitVerificationRequest(tier: String, paymentReference: String, amount: Int): Boolean = withContext(Dispatchers.IO) {\n        try {\n            val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n            val json = JSONObject().apply {\n                put("user_id", uid); put("tier", tier); put("payment_reference", paymentReference); put("amount", amount); put("status", "pending")\n            }\n            executeRequest(newRequestBuilder("/rest/v1/verification_requests", true).addHeader("Prefer", "return=representation").post(json.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n                val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Verification request failed.")); true\n            }\n        } catch (e: Exception) { Log.e(TAG, "submitVerificationRequest failed", e); false }\n    }''')

              # Game persistence uses game_profiles, not the nonexistent leaderboard table contract.
              s = replace_function(s, 'updateGameStats', '''    suspend fun updateGameStats(score: Int, coins: Int, streak: Int): Boolean = withContext(Dispatchers.IO) {\n        try {\n            val uid = getCurrentUserId() ?: throw IllegalStateException("Not authenticated.")\n            val json = JSONObject().apply { put("user_id", uid); put("score", score); put("coins", coins); put("streak", streak); put("updated_at", nowIso()) }\n            executeRequest(newRequestBuilder("/rest/v1/game_profiles?user_id=eq.${encodeValue(uid)}", true).addHeader("Prefer", "resolution=merge-duplicates,return=representation").patch(json.toString().toRequestBody(jsonMediaType)).build()).use { resp ->\n                val body = resp.body?.string().orEmpty(); if (!resp.isSuccessful) throw IllegalStateException(parseSupabaseError(body, "Game stats update failed.")); true\n            }\n        } catch (e: Exception) { Log.e(TAG, "updateGameStats failed", e); false }\n    }''')

              return s

          patch(service, patch_service)

          # -------------------------
          # AuthRepository.kt
          # -------------------------
          patch('app/src/main/java/com/example/data/repository/AuthRepository.kt', lambda s: replace_function(s, 'checkCachedSession', '''    private fun checkCachedSession() {\n        // SharedPreferences is cache only. A real Supabase session must be\n        // restored and validated before the app can become authenticated.\n        _authState.value = AuthState.Initial\n    }''').replace('''    fun signOut() {\n        prefs.edit().clear().apply()\n        SupabaseService.clearSession()\n        _authState.value = AuthState.Unauthenticated()\n    }''', '''    fun signOut() {\n        prefs.edit().clear().apply()\n        SupabaseService.clearSession()\n        _authState.value = AuthState.Unauthenticated()\n    }''', 1))

          # -------------------------
          # ViewModel: real session restore and no permanent local feed merge
          # -------------------------
