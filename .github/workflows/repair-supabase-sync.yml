name: Verify Blink Supabase synchronization

on:
  push:
    branches: [fix/supabase-sync]

concurrency:
  group: blink-supabase-verification
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply source repairs
        run: python tools/repair_supabase_sync.py && python tools/compile_import_patch.py && python tools/finalize_supabase_sync.py && python tools/fix_build.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/repair_supabase_sync.py tools/compile_import_patch.py tools/fix_build.py tools/finalize_supabase_sync.py .github/workflows/repair-supabase-sync.yml .github/workflows/verify-supabase-sync.yml SUPABASE_REPAIR_TRIGGER.md
          git add .
          git commit -m "fix: synchronize Blink with Supabase" || exit 0
          git push origin HEAD:fix/supabase-sync
