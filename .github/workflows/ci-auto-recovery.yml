# GitHub can retry transient failures, but arbitrary source fixes need a coding agent.
# Trust boundary: execute ONLY default-branch code; never run PR checkout with write access.
name: BLINK CI automatic recovery

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: 'Failed BLINK workflow run ID to diagnose or retry'
        required: true
        type: string
permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: blink-ci-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose-and-retry:
    if: github.repository == 'Glimmar-code/Blinkng' && github.actor == 'Glimmar-code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted recovery controller from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Diagnose latest failed steps and retry safely
        uses: actions/github-script@v7
        with:
          script: |
            const recovery = require('./.github/scripts/ci_auto_recovery.cjs');
            const runId = Number(context.payload.inputs?.failed_run_id);
            if (!Number.isSafeInteger(runId) || runId < 1) {
              throw new Error('Enter a valid GitHub Actions run ID');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner:'Glimmar-code', repo:'Blinkng', run_id:runId
            });
            if (run.head_repository?.full_name !== 'Glimmar-code/Blinkng' ||
                run.status !== 'completed' || run.conclusion !== 'failure') {
              throw new Error('The selected workflow is not a failed BLINK run');
            }
            const {data: branch} = await github.rest.repos.getBranch({
              owner:'Glimmar-code', repo:'Blinkng', branch:run.head_branch
            });
            if (branch.commit.sha !== run.head_sha) {
              throw new Error('The failing run is from an outdated commit');
            }
            await recovery({
              github, context:{
                eventName:'workflow_run', repo:context.repo,
                payload:{workflow_run:run}
              }, core
            });
