name: Apply reels back to feed fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_reels_back_to_feed.py
      - .github/workflows/apply-reels-back-to-feed.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Apply navigation fix
        run: python3 tools/apply_reels_back_to_feed.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit and safely push
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt
          git commit -m "fix: back from reels returns to feed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update; retrying ($attempt/5)"
          done
          exit 1
