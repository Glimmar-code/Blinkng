name: Google Play preflight (no Play account required)

on:
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/signed-release.yml'
      - '.github/workflows/android-build-check.yml'
      - '.github/workflows/play-store-preflight.yml'
      - 'scripts/play_store_preflight.py'
      - 'web/privacy/**'
      - 'web/delete-account/**'
      - 'play-store/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit BLINK Play submission prerequisites
        run: python3 scripts/play_store_preflight.py --output build/reports/play/preflight.json
      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-store-preflight-report
          path: build/reports/play/preflight.json
          if-no-files-found: warn
          retention-days: 14
