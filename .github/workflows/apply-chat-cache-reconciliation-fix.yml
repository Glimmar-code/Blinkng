name: Apply chat cache reconciliation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_chat_cache_reconciliation_fix.py'
      - '.github/workflows/apply-chat-cache-reconciliation-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-cache-reconciliation-fix
  cancel-in-progress: false

jobs:
  apply-validate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply chat cache reconciliation fix
        run: python3 .github/scripts/apply_chat_cache_reconciliation_fix.py

      - name: Verify patch formatting
        run: git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Commit validated cache fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/data/local/CachedContent.kt \
            app/src/main/java/com/example/data/local/OfflineContentStore.kt \
            app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
          if git diff --cached --quiet; then
            echo "Chat cache source is already up to date."
            exit 0
          fi
          git commit -m "fix: reconcile durable chat cache identities"
          git pull --rebase origin main
          git push origin HEAD:main
