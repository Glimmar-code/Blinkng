name: Apply post identity and story ring fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_post_identity_story_ring_fix.py'
      - '.github/workflows/apply-post-identity-story-ring-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply post identity and story ring fixes
        run: python3 .github/scripts/apply_post_identity_story_ring_fix.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/models/PostModel.kt \
                  app/src/main/java/com/example/data/supabase/SupabaseService.kt \
                  app/src/main/java/com/example/ui/components/PostCard.kt \
                  app/src/main/java/com/example/ui/screens/FeedScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: show post identity and story-only avatar rings"
          git push origin main
