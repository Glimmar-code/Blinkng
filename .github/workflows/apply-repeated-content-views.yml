name: Apply repeated post and reel views

on:
  push:
    paths:
      - '.github/workflows/apply-repeated-content-views.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply repeated content-view patch
        run: python .github/scripts/apply_repeated_content_views.py

      - name: Compile and test
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/data/supabase/ContentViewService.kt \
            app/src/main/java/com/example/data/views/ContentViewCoordinator.kt \
            app/src/main/java/com/example/data/local/OfflineMutationQueue.kt \
            app/src/main/java/com/example/data/local/OfflineMutationWorker.kt \
            app/src/main/java/com/example/ui/components/ContentExposureTracker.kt \
            app/src/main/java/com/example/ui/components/PostCard.kt \
            app/src/main/java/com/example/ui/screens/FeedScreen.kt \
            app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt \
            app/src/test/java/com/example/data/views/ContentViewDisplayStateTest.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: add repeated delayed post and reel views"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            echo "Could not push source fixes after retries"
            exit 1
          fi
