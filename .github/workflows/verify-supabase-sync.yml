name: Verify Blink Supabase synchronization directly

on:
  push:
    branches: [fix/supabase-sync]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source repairs
        run: python tools/repair_supabase_sync.py && python tools/compile_import_patch.py && python tools/finalize_supabase_sync.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Commit verified source and wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/repair_supabase_sync.py tools/compile_import_patch.py tools/finalize_supabase_sync.py .github/workflows/verify-supabase-sync.yml .github/workflows/repair-supabase-sync.yml SUPABASE_REPAIR_TRIGGER.md
          git add .
          git commit -m "fix: synchronize Blink with Supabase" || exit 0
          git push origin HEAD:fix/supabase-sync
