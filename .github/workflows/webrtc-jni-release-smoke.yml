name: BLINK release-minified WebRTC JNI smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'app/src/main/java/com/example/call/**'
      - 'app/src/androidTest/java/com/example/call/**'
      - '.github/workflows/webrtc-jni-release-smoke.yml'
  pull_request:
    branches: [main, Testlab, 'Testlab-*']
    paths:
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'app/src/main/java/com/example/call/**'
      - 'app/src/androidTest/java/com/example/call/**'
      - '.github/workflows/webrtc-jni-release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webrtc-jni-r8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-webrtc-android15:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BLINK_RTC_SMOKE: 'true'
      ALLOW_PLACEHOLDER_GOOGLE_SERVICES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve WebRTC runtime dependency
        run: gradle :app:dependencyInsight --configuration rtcSmokeRuntimeClasspath --dependency io.github.webrtc-sdk --no-daemon
      - name: Build R8-shrunk APK and instrumentation APK
        run: |
          # Room/KSP emits variant schemas to a shared directory. Parallel debug
          # and rtcSmoke KSP tasks can read a half-written schema JSON, failing
          # with JsonDecodingException at database.identityHash. Serialize Gradle
          # workers for this CI-only native smoke build; production tasks unchanged.
          gradle :app:assembleRtcSmoke :app:assembleRtcSmokeAndroidTest --stacktrace --no-daemon --no-parallel --max-workers=1
      - name: Verify native libraries ship for Redmi ARM64 and emulator x86_64
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/rtcSmoke/app-rtcSmoke.apk"
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libjingle_peerconnection_so.so'
          unzip -Z1 "$apk" | grep -Fx 'lib/x86_64/libjingle_peerconnection_so.so'
          # Fail closed if the supposed release-like build was not actually R8-shrunk.
          test -s app/build/outputs/mapping/rtcSmoke/mapping.txt
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise WebRTC JNI_OnLoad on Android 15 API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
            # The emulator action executes each script line separately. Backslash
            # continuations therefore become a bogus Gradle task named '\\'.
            gradle :app:connectedRtcSmokeAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.call.WebRtcJniReleaseSmokeTest --stacktrace --no-daemon --no-parallel --max-workers=1
      - name: Upload minified JNI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-jni-r8-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/mapping/rtcSmoke/
          if-no-files-found: warn
          retention-days: 14
