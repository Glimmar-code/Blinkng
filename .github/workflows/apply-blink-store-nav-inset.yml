name: Apply Blink Store navigation inset fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-blink-store-nav-inset.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keep Blink Store above Android system navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/BlinkStoreActivity.kt')
          text = path.read_text()

          import_line = 'import androidx.compose.foundation.layout.navigationBarsPadding\n'
          if import_line not in text:
              anchor = 'import androidx.compose.foundation.layout.height\n'
              if anchor not in text:
                  raise SystemExit('BlinkStoreActivity layout import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          old = 'Row(Modifier.fillMaxWidth().padding(vertical = 6.dp)) {'
          new = '''Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .navigationBarsPadding()
                          .padding(vertical = 6.dp)
                  ) {'''

          if old in text:
              text = text.replace(old, new, 1)
          elif '.navigationBarsPadding()' not in text:
              raise SystemExit('Blink Store bottom navigation row not found')

          path.write_text(text)
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit Store navigation fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/BlinkStoreActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: keep Blink Store nav above system buttons"
          git pull --rebase origin main
          git push origin HEAD:main
