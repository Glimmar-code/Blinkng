name: Apply requested app fixes
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-requested-app-fixes.yml'
permissions:
  contents: write
jobs:
  fix-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
