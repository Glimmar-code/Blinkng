          def read(rel):
              return (ROOT / rel).read_text()
          def write(rel, text):
              (ROOT / rel).write_text(text)
          def replace_once(rel, old, new):
              p = ROOT / rel
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {rel}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once('app/src/main/java/com/example/data/repository/AuthRepository.kt', 'val url = "$baseUrl/auth/v1/authorize?provider=google&redirect_to=$redirect"', 'val url = "$baseUrl/auth/v1/authorize?provider=google&redirect_to=$redirect&flow_type=implicit"')

