name: BLINK calling quality gate

on:
  push:
    branches: [Testlab]
    paths:
      - '.github/workflows/calls-phase1-check.yml'
      - 'app/src/main/java/com/example/call/**'
      - 'app/src/test/java/com/example/call/**'
      - 'app/src/androidTest/java/com/example/call/**'
      - 'app/src/androidTest/java/com/example/WebRtcNativeLoadSmokeTest.kt'
      - 'supabase/functions/get-call-ice-config/**'
      - 'supabase/functions/send-call-notification/**'
      - 'app/src/main/java/com/example/notification/BlinkFirebaseMessagingService.kt'
      - 'docs/native-calls.md'
  pull_request:
    paths:
      - 'app/src/main/java/com/example/call/**'
      - 'app/src/test/java/com/example/call/**'
      - 'app/src/androidTest/java/com/example/call/**'
      - 'app/src/androidTest/java/com/example/WebRtcNativeLoadSmokeTest.kt'
      - 'supabase/functions/get-call-ice-config/**'
      - 'supabase/functions/send-call-notification/**'
      - 'app/src/main/java/com/example/notification/BlinkFirebaseMessagingService.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blink-calls-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-call-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android call code
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon
      - name: Call unit tests
        run: gradle :app:testDebugUnitTest --tests 'com.example.call.*' --stacktrace --no-daemon

  edge-credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate TURN credential and push Edge Functions
        run: |
          deno check supabase/functions/get-call-ice-config/index.ts
          deno check supabase/functions/send-call-notification/index.ts

  android15-peer-smoke:
    # Call JNI/SDP/ICE regressions merit an emulator; ordinary patches don't.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Android emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 native WebRTC and paired voice/video SDP/ICE smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.aistudio.blink.appvtwo android.permission.RECORD_AUDIO
            adb shell pm grant com.aistudio.blink.appvtwo android.permission.CAMERA
            gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.example.WebRtcNativeLoadSmokeTest,com.example.call.WebRtcCallPairSmokeTest" --stacktrace --no-daemon
      - name: Upload Android 15 WebRTC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-webrtc-pair-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
