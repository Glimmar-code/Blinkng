name: Apply profile streak and Blink Coin

on:
  push:
    paths:
      - '.github/workflows/apply-profile-streak-blink-coin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply profile feature changes
        run: python .github/scripts/apply_profile_streak_blink_coin.py
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/supabase/SupabaseService.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt \
                  app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/ui/screens/ProfileScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: add profile streak and private blink coin"
            git push origin HEAD:main
          fi
