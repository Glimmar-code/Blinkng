name: Apply simple feed and menu v1

on:
  push:
    paths:
      - '.github/workflows/apply-simple-feed-menu-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply simple feed and menu redesign
        run: python .github/scripts/apply_simple_feed_menu_v1.py
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon
      - name: Commit source redesign and clean one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply_simple_feed_menu_v1.py
          rm -f .github/workflows/apply-simple-feed-menu-v1.yml
          git add app/src/main/java/com/example/ui/components/PostCard.kt
          git add app/src/main/java/com/example/ui/components/AppMenuSheet.kt
          git add app/src/main/java/com/example/ui/components/FloatingBottomBar.kt
          git add app/src/main/java/com/example/ui/screens/FeedScreen.kt
          git add -A .github/scripts/apply_simple_feed_menu_v1.py .github/workflows/apply-simple-feed-menu-v1.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "ui: simplify feed and menu like social app reference"
            git push origin HEAD:main
          fi
