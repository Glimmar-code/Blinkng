name: Testlab Connect slide-over validation

on:
  push:
    branches:
      - Testlab-connect-slide-panel-20260908
    paths:
      - '.github/workflows/testlab-connect-slide-panel.yml'
      - '.github/scripts/apply_connect_slide_panel.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Testlab branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply focused Connect UX patch
        run: python .github/scripts/apply_connect_slide_panel.py

      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'openCategoryIndex' app/src/main/java/com/example/ui/screens/ConnectHubPremiumPanel.kt
          grep -q 'slideInHorizontally' app/src/main/java/com/example/ui/screens/ConnectHubPremiumPanel.kt
          grep -q 'desktopConnectSlidePanel' desktopApp/src/main/kotlin/com/blinkng/desktop/ui/ContentScreens.kt
          grep -q 'Connect slide-over workflows' platform-parity/changes.md

      - name: Create local candidate commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/ui/screens/ConnectHubPremiumPanel.kt \
            desktopApp/src/main/kotlin/com/blinkng/desktop/ui/ContentScreens.kt \
            platform-parity/changes.md
          git commit -m "fix: open Connect workflows in animated slide-over"

      - name: Android Kotlin compile
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Android debug APK build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Windows desktop build
        run: gradle -p desktopApp build --stacktrace --no-daemon

      - name: Ensure verification did not mutate tracked source
        run: |
          rm -rf app/schemas
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Unexpected tracked changes after validation"
            git status --short
            exit 1
          fi

      - name: Push verified candidate to isolated Testlab branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" HEAD; then
            echo "Testlab branch advanced during validation; refusing to overwrite it"
            exit 1
          fi
          git push origin HEAD:"$GITHUB_REF_NAME"
