name: Synchronize BLINK launcher assets in Testlab
on:
  push:
    branches:
      - Testlab
      - 'Testlab-*'
    paths:
      - 'scripts/sync_android_launcher_assets.py'
      - 'app/src/main/res/drawable/app_icon.png'
      - 'app/src/main/res/drawable/ic_launcher_foreground.xml'
      - 'app/src/main/res/mipmap-*/ic_launcher*.png'
      - '.github/workflows/sync-blink-launcher-testlab.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate deterministic Android launcher bitmaps
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/sync_android_launcher_assets.py
          python3 scripts/sync_android_launcher_assets.py --check
      - name: Commit launcher resources to Testlab only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/mipmap-*/ic_launcher*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Sync all density launcher icons with approved BLINK master'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
