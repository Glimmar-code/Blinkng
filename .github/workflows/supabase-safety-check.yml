name: Supabase safety gate

on:
  push:
    branches: [Testlab, main]
  pull_request:
    branches: [Testlab, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-safety-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Supabase changes statically
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/check_supabase_safety.py

      - name: Install PostgreSQL SQL parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'pglast==7.10'

      - name: Validate migration SQL syntax
        run: python3 scripts/check_supabase_sql_syntax.py

      - name: Detect complete local schema baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f supabase/migrations/00000000000000_schema_baseline.sql ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Complete schema baseline found; enabling full local rebuild.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No complete schema baseline is tracked yet.'
            echo 'Legacy migrations were captured from an already-existing production schema, so a clean rebuild would produce false dependency failures.'
            echo 'Static safety and PostgreSQL syntax validation remain mandatory.'
          fi

      - name: Install pinned Supabase CLI
        if: steps.baseline.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start disposable local Supabase
        if: steps.baseline.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This starts Docker services on the GitHub runner only. It does not
          # link to, reset, push to, or otherwise modify the production project.
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild database from migrations
        if: steps.baseline.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # --local is explicit so this command can never target a linked cloud DB.
          supabase db reset --local

      - name: Lint rebuilt local database
        if: steps.baseline.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --fail-on error

      - name: Verify local Auth API health
        if: steps.baseline.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:54321/auth/v1/health >/dev/null
          echo 'Disposable local Supabase is healthy; no production backend was used.'

      - name: Stop and erase disposable Supabase
        if: always() && steps.baseline.outputs.available == 'true'
        shell: bash
        run: supabase stop --no-backup || true

      - name: Confirm staging-first policy
        shell: bash
        run: |
          echo 'Supabase production changes must be promoted only after Testlab verification.'
          if [[ '${{ steps.baseline.outputs.available }}' == 'true' ]]; then
            echo 'Full disposable local Supabase rebuild completed.'
          else
            echo 'Full rebuild is intentionally disabled until a complete schema baseline is checked in.'
            echo 'Current gate still enforces migration placement, destructive-change review, and PostgreSQL syntax correctness.'
          fi
