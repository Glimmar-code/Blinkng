name: Apply premium feed redesign wiring

on:
  push:
    branches: [chatgpt/premium-feed-redesign]
    paths:
      - '.github/scripts/apply_premium_feed_redesign.py'
      - '.github/workflows/apply-premium-feed-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/premium-feed-redesign
          fetch-depth: 0

      - name: Apply wiring patch
        run: python .github/scripts/apply_premium_feed_redesign.py

      - name: Commit generated wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt
          git commit -m "feat: wire premium feed and five-destination bottom bar"
          git push origin HEAD:chatgpt/premium-feed-redesign
