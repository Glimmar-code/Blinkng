# One-time removal of the empty, accidentally re-created Testlab ref.
# The original legacy Testlab remains preserved at archive/Testlab-before-promotion-20261025.
# This workflow only deletes an exact unmodified ref, after changes go directly
# through a passing PR to protected main. Never delete an active development branch.
name: Retire empty Testlab branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-testlab-branch.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    if: github.repository == 'Glimmar-code/Blinkng' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the exact empty Testlab branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Glimmar-code', repo = 'Blinkng';
            const branch = 'Testlab';
            // This is the exact SHA at which the empty branch was created.
            const emptySha = '10509492f247301aa2db0a66f974b3e1094c7f4e';
            const {data: info} = await github.rest.repos.get({owner,repo});
            if (info.default_branch !== 'main') throw new Error('Unexpected default branch');
            let current;
            try {
              current = (await github.rest.repos.getBranch({owner,repo,branch})).data;
            } catch (error) {
              if (error.status === 404) {
                core.info('Testlab already absent');
                return;
              }
              throw error;
            }
            if (current.commit.sha !== emptySha) {
              throw new Error('Testlab contains new commits; refusing to delete');
            }
            if (current.protected) throw new Error('Branch is protected');
            const open = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:'open',per_page:100
            });
            if (open.some(pr =>
              (pr.head?.ref === branch && pr.head?.repo?.full_name === owner+'/'+repo) ||
              pr.base?.ref === branch
            )) {
              throw new Error('An open pull request still uses Testlab');
            }
            // Retain all other branches, including the existing archived backup.
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
            core.info('Deleted exact empty Testlab branch; main/history unchanged');
