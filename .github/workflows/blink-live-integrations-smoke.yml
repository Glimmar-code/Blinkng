name: BLINK production integrations smoke

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify-public-site:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout precisely deployed main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow GitHub Pages CDN to serve the new immutable revision
        run: sleep 20
      - name: Check live SEO, Auth provider, official App Links and anonymous analytics
        env:
          # A Testlab branch checks the current public website only. After a
          # successful main deployment, verify newly published SEO pages too.
          BLINK_SEO_POST_DEPLOY: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
          BLINK_EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # On Testlab pushes compare unchanged public assets to the current
          # live site; on production deploys compare against deployed main.
          BLINK_VERIFY_STATIC_SOURCE: '1'
          # Do not add synthetic production visits during a Testlab-only check.
          BLINK_VERIFY_SYNTHETIC_ANALYTICS: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: node scripts/verify_live_blink_integrations.mjs
      - name: Install Playwright Chrome for a real public-only browser measurement
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify anonymous page-view request from real mobile Chrome
        run: node scripts/verify_live_browser_analytics.mjs
