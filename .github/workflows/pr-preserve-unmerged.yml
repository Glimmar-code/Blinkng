# Default-branch trusted PR lifecycle guard. Never check out a PR's head.
name: BLINK preserve unmerged pull requests

on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: blink-preserve-closed-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preserve-or-reopen:
    if: github.repository == 'Glimmar-code/Blinkng' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted preservation policy from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify preservation evidence or reopen unmerged PR
        uses: actions/github-script@v7
        with:
          script: |
            const guard = require('./.github/scripts/pr_closure_preservation.cjs');
            await guard({ github, context, core });
