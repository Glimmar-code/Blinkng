name: Apply market leaderboard feed fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_market_leaderboard_feed_fix.py
      - .github/workflows/apply-market-leaderboard-feed-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Apply source fixes
        run: python3 tools/apply_market_leaderboard_feed_fix.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit validated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/MarketScreen.kt \
                  app/src/main/java/com/example/ui/screens/LeaderboardScreen.kt \
                  app/src/main/java/com/example/ui/screens/PremiumFeedScreen.kt \
                  app/src/main/java/com/example/viewmodel/BlinkViewModel.kt
          git commit -m "fix: live market smooth leaderboard staged feed chrome"
          git push origin HEAD:main
