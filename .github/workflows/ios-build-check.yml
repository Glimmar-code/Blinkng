name: iOS foundation quality gate

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create native Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Compile unsigned iOS Simulator app
        working-directory: ios
        run: |
          xcodebuild -project BLINKiOS.xcodeproj -scheme BLINKiOS \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Find available iPhone Simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          ids=[d["udid"] for devices in data["devices"].values() for d in devices
               if "iPhone" in d.get("name","") and d.get("isAvailable",False)]
          print(ids[0] if ids else "")
          ')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPhone Simulator found on this runner"
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          xcodebuild -project BLINKiOS.xcodeproj -scheme BLINKiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
