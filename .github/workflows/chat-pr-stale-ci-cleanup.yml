name: BLINK chat PR stale CI cleanup

# Repeated small commits left obsolete runs queued, which can prevent the
# *current* candidate from getting a clean Android/Windows/Supabase verdict.
# This job may cancel ONLY earlier checks from this PR's exact same branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: chat-pr-ci-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-obsolete-checks:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.number == 523 || github.event.pull_request.number == 543) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.number == 523 &&
        github.event.pull_request.head.ref == 'feature/chat-all-attachments-20261024') ||
       (github.event.pull_request.number == 543 &&
        github.event.pull_request.head.ref == 'integrate/chat-media-523-onto-main-20261025'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const prNumber=context.payload.pull_request.number;
            const current=context.payload.pull_request.head.sha;
            const branch=context.payload.pull_request.head.ref;
            let cancelled=0, failed=0;
            // Narrowly filter the exact PR branch and its older head revisions.
            // The currently tested SHA and workflows for all other branches
            // and PRs must never be cancelled.
            const runs=await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {owner,repo,branch,event:'pull_request',per_page:100}
            );
            for (const run of runs) {
              if (cancelled >= 250) break;
              if (run.head_branch !== branch || run.head_sha === current) continue;
              if (!['queued','in_progress','waiting','pending','requested'].includes(run.status)) continue;
              if (!run.pull_requests?.some(pr=>pr.number===prNumber)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
                cancelled++;
              } catch (error) {
                // Ignore races with jobs that just ended.
                failed++;
                core.warning(`Could not cancel superseded run ${run.id}: ${error.message}`);
              }
            }
            core.summary.addHeading(`BLINK PR #${prNumber} CI queue cleanup`)
              .addRaw(`Superseded PR jobs cancelled: ${cancelled}; races/denials: ${failed}.\\n`)
              .addRaw('Only obsolete SHA runs were considered. The current PR checks were kept intact.\\n')
              .write();
