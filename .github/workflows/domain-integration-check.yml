name: BLINK domain integration check

on:
  push:
    branches:
      - 'Testlab*'
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt'
      - 'app/src/main/java/com/example/sharing/**'
      - 'app/src/test/java/com/example/sharing/**'
      - 'web/**'
      - '.github/workflows/domain-integration-check.yml'
      - '.github/workflows/deploy-web-preview.yml'
      - 'scripts/check_github_pages_site.py'
      - 'scripts/test_domain_auth_links.mjs'
      - 'scripts/test_android_prod_links.mjs'
      - 'scripts/verify_live_blink_integrations.mjs'
      - 'scripts/test_landing_phase1.mjs'
      - 'scripts/test_discovery_phase2.mjs'
      - 'scripts/test_web_production_phase3.mjs'
      - 'scripts/test_web_production_phase3_authseo.mjs'
      - 'scripts/test_mobile_web_performance.mjs'
      - 'scripts/test_web_local_analytics.mjs'
      - 'scripts/test_site_aggregate_analytics.mjs'
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/main/java/com/example/ui/screens/VideoReelsScreen.kt'
      - 'app/src/main/java/com/example/sharing/**'
      - 'app/src/test/java/com/example/sharing/**'
      - 'web/**'
      - '.github/workflows/domain-integration-check.yml'
      - '.github/workflows/deploy-web-preview.yml'
      - 'scripts/check_github_pages_site.py'
      - 'scripts/test_domain_auth_links.mjs'
      - 'scripts/test_android_prod_links.mjs'
      - 'scripts/verify_live_blink_integrations.mjs'
      - 'scripts/test_landing_phase1.mjs'
      - 'scripts/test_discovery_phase2.mjs'
      - 'scripts/test_web_production_phase3.mjs'
      - 'scripts/test_web_production_phase3_authseo.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect Android-affecting changes
        id: scope
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci_change_scope.py >> "$GITHUB_OUTPUT"
      - name: Explain web-only validation
        if: steps.scope.outputs.android != 'true'
        run: echo "Web/domain static tests ran; no Android build inputs changed."

      - name: Validate official domain URL and evergreen APK downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_github_pages_site.py
          grep -F 'const SITE_URL' web/app.js >/dev/null
          # All homepage and in-app download buttons must resolve to the newest signed
          # GitHub Release, including future versions, without a site code change.
          python3 - <<'PY'
          from pathlib import Path
          app = Path("web/app.js").read_text(encoding="utf-8")
          latest = "https://github.com/Glimmar-code/Blinkng/releases/latest/download/Blink-latest.apk"
          if app.count(latest) != 1 or f"const APK_URL = '{latest}';" not in app:
              raise SystemExit("BLINK needs exactly one canonical, evergreen latest-APK URL.")
          if app.count('href="${APK_URL}"') < 5:
              raise SystemExit("BLINK download buttons must retain the official APK_URL; do not remove download links.")
          if "releases/download/v" in app:
              raise SystemExit("Website must not pin a particular BLINK APK version.")
          print("All BLINK website download buttons track future signed APK releases.")
          PY
          grep -F 'const url = SITE_URL + normalizedPath;' web/app.js >/dev/null
          grep -F '<link rel="canonical" href="https://blink.com.ng/" />' web/index.html >/dev/null
          test -f web/privacy/index.html
          grep -F '<link rel="canonical" href="https://blink.com.ng/privacy/" />' web/privacy/index.html >/dev/null
          grep -F 'https://blink.com.ng/privacy/' web/sitemap.xml >/dev/null
          grep -F 'android:autoVerify="true"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'Uri.parse("https://blink.com.ng")' app/src/main/java/com/example/sharing/DeepLinkRouter.kt >/dev/null

      # Production Android App Links target blink.com.ng. Google OAuth and
      # recovery callbacks must be approved in Supabase Auth URL Configuration.
      - name: Verify secure canonical OAuth and recovery redirects
        run: node scripts/test_domain_auth_links.mjs

      - name: Guard sitewide analytics disabled defaults and no visitor data
        run: node scripts/test_site_aggregate_analytics.mjs

      - name: Check no-tracking opt-in analytics and anonymous funnel counts
        run: node scripts/test_web_local_analytics.mjs

      - name: Check mobile asset budgets and locally opt-in Core Web Vitals
        run: node scripts/test_mobile_web_performance.mjs

      - name: Test Phase 3 resilient authentication and private-route SEO
        run: node scripts/test_web_production_phase3_authseo.mjs

      - name: Test Phase 3 private-safe cache, offline loading and fresh website updates
        run: node scripts/test_web_production_phase3.mjs

      - name: Check Phase 2 university catalogue, public discovery and release metadata
        run: node scripts/test_discovery_phase2.mjs

      - name: Check Phase 1 BLINK homepage design, mobile usability and route wiring
        run: node scripts/test_landing_phase1.mjs

      - name: Verify official Android App Links route matrix and signing
        run: node scripts/test_android_prod_links.mjs

      - name: Validate live verification script syntax
        run: node --check scripts/verify_live_blink_integrations.mjs

      - name: Validate existing Android signing association
        shell: bash
        run: |
          set -euo pipefail
          test -f web/.nojekyll
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/.well-known/assetlinks.json")
          data = json.loads(path.read_text())
          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit("assetlinks.json must contain exactly one BLINK Android association")

          association = data[0]
          relations = association.get("relation", [])
          target = association.get("target", {})
          expected_fingerprint = "88:B4:18:51:36:2B:F2:BC:B2:60:58:91:49:3B:B4:1C:40:F3:23:31:84:DF:77:35:69:F8:7D:B9:03:C5:26:64"

          if "delegate_permission/common.handle_all_urls" not in relations:
              raise SystemExit("assetlinks.json is missing handle_all_urls permission")
          if target.get("namespace") != "android_app":
              raise SystemExit("assetlinks.json namespace must be android_app")
          if target.get("package_name") != "com.aistudio.blink.appvtwo":
              raise SystemExit("assetlinks.json package does not match the BLINK Android applicationId")
          if expected_fingerprint not in target.get("sha256_cert_fingerprints", []):
              raise SystemExit("assetlinks.json is not pinned to the BLINK production signing certificate")
          print("BLINK Android App Links association is valid.")
          PY

      - name: Validate web syntax and static files
        shell: bash
        run: |
          set -euo pipefail
          node --check web/config.js
          node --check web/app.js
          node --check web/sw.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
          python3 -m json.tool web/.well-known/assetlinks.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("web/sitemap.xml")
          PY

      - name: Set up Java
        if: steps.scope.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.scope.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test, lint and build Android debug APK
        if: steps.scope.outputs.android == 'true'
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
