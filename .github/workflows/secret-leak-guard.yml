name: Secret leak guard

on:
  push:
    branches:
      - main
      - Testlab
      - 'Testlab-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked production Firebase config
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch app/google-services.json >/dev/null 2>&1; then
            echo "::error::app/google-services.json must never be tracked. Use app/google-services.json.example and the protected CI secret."
            exit 1
          fi

      - name: Reject committed Google API keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- . ':!app/google-services.json.example'; then
            echo "::error::A Google API key-shaped value is committed in the current source tree."
            exit 1
          fi
          echo "No committed Google API key-shaped values found."

      - name: Verify Firebase restore script with safe CI placeholder
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/restore_google_services.sh ci
          rm -f app/google-services.json
