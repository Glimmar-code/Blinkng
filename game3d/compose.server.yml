# Preview dedicated server. Requires Docker, a UDP-reachable host and secrets.
# NO automatic production deployment. Use staging and the same secret as the
# Supabase Edge ticket issuer BLINK_LIFE_AUTH_SECRET.
services:
  blink-life:
    build:
      context: ..
      dockerfile: game3d/Dockerfile
    restart: unless-stopped
    environment:
      BLINK_LIFE_AUTH_SECRET: "${BLINK_LIFE_AUTH_SECRET:?Set a 32+ character random server secret}"
      BLINK_LIFE_SERVER_PORT: "24567"
    ports:
      - "24567:24567/udp"
    volumes:
      - blink_life_game_data:/var/lib/blinklife
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m

volumes:
  blink_life_game_data:
