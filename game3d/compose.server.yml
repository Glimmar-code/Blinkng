# Preview dedicated WSS TLS server: TCP only, no plaintext UDP exposure.
# Operator provisions CA-trusted certs, secret, and private staging host.
# Never store private keys or production secrets in GitHub.
services:
  blink-life:
    build:
      context: ..
      dockerfile: game3d/Dockerfile
    restart: unless-stopped
    environment:
      BLINK_LIFE_AUTH_SECRET: "${BLINK_LIFE_AUTH_SECRET:?Set unique 32+ character server secret}"
      BLINK_LIFE_SERVER_PORT: "24567"
      BLINK_LIFE_TLS_CERT_PATH: "/run/blinklife/tls/cert.pem"
      BLINK_LIFE_TLS_KEY_PATH: "/run/blinklife/tls/key.pem"
    ports:
      - "24567:24567/tcp"
    volumes:
      - blink_life_game_data:/var/lib/blinklife
      - "${BLINK_LIFE_TLS_CERT_FILE:?Set certificate file path}:/run/blinklife/tls/cert.pem:ro"
      - "${BLINK_LIFE_TLS_KEY_FILE:?Set private key file path}:/run/blinklife/tls/key.pem:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m

volumes:
  blink_life_game_data:
