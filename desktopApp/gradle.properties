# Windows desktop uses desktopApp/settings.gradle.kts as its root build.
# The Android root's ../gradle.properties is not inherited by `gradle -p desktopApp`.
# Compile the large Compose desktop UI with a bounded, explicit JVM heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
